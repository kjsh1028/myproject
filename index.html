<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Project</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1c2130;
  --s1: #242b3d;
  --s2: #2c3450;
  --s3: #354060;
  --bd: #3d4d6e;
  --gold: #d4a84b;
  --gdim: rgba(212,168,75,0.13);
  --tx: #f0f2f8;
  --t2: #a8b4cc;
  --t3: #6070a0;
  --red: #e06868;
  --green: #50c080;
  --blue: #60a0e8;
  --orange: #e09040;
  --SAT: env(safe-area-inset-top,0px);
  --SAB: env(safe-area-inset-bottom,0px);
  --TABH: 68px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--tx); font-family: 'DM Sans', sans-serif; overflow: hidden; font-size: 16px; }

#stack { position: relative; width: 100%; height: 100dvh; overflow: hidden; }
.layer { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); }
.layer.base { transform: translateX(0); }
.layer.active { transform: translateX(0); }
.layer.behind { transform: translateX(-26%); }

/* TOPBAR */
.topbar { flex-shrink: 0; padding-top: var(--SAT); background: var(--s1); border-bottom: 1px solid var(--bd); }
.topbar-inner { height: 54px; display: flex; align-items: center; padding: 0 14px 0 8px; gap: 4px; }
.topbar h1 { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--gold); flex: 1; padding-left: 6px; }
.topbar h2 { font-size: 17px; font-weight: 600; flex: 1; padding-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back-btn, .icon-btn { width: 42px; height: 42px; border-radius: 10px; background: none; border: none; color: var(--t2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.back-btn:active, .icon-btn:active { background: var(--s3); }

/* TABBAR */
#tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: calc(var(--TABH) + var(--SAB)); padding-bottom: var(--SAB); background: var(--s1); border-top: 1px solid var(--bd); display: flex; z-index: 50; }
.tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; color: var(--t3); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; }
.tab-btn svg { width: 24px; height: 24px; }
.tab-btn.on { color: var(--gold); }

/* SCROLL BODY */
.lbody { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--TABH) + var(--SAB) + 10px); }
.lbody::-webkit-scrollbar { display: none; }
.lbody2 { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 30px; }
.lbody2::-webkit-scrollbar { display: none; }

/* FAB */
.fab { position: absolute; bottom: calc(var(--TABH) + var(--SAB) + 18px); right: 18px; width: 54px; height: 54px; border-radius: 50%; background: var(--gold); color: #1c2130; border: none; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(212,168,75,.4); z-index: 51; transition: transform .15s; }
.fab:active { transform: scale(.9); }

/* CATEGORY TABS (중요/일반/보류/폐기) */
.cat-tabs { display: flex; background: var(--s1); border-bottom: 1px solid var(--bd); flex-shrink: 0; }
.cat-tab { flex: 1; padding: 13px 4px; text-align: center; font-size: 14px; font-weight: 500; color: var(--t3); cursor: pointer; border-bottom: 2px solid transparent; transition: all .18s; }
.cat-tab.on { color: var(--gold); border-bottom-color: var(--gold); }

/* DEAL CARD */
.deal-card { padding: 16px; border-bottom: 1px solid var(--bd); cursor: pointer; display: flex; gap: 14px; align-items: flex-start; }
.deal-card:active { background: var(--s2); }
.deal-left { flex: 1; min-width: 0; }
.deal-name { font-size: 18px; font-weight: 600; color: var(--tx); margin-bottom: 6px; }
.deal-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.deal-next { font-size: 13px; color: var(--t2); display: flex; align-items: center; gap: 5px; margin-top: 4px; }
.deal-next::before { content: '→'; color: var(--gold); }
.deal-right { text-align: right; flex-shrink: 0; padding-top: 2px; }
.deal-fee { font-size: 16px; color: var(--gold); font-weight: 600; }
.deal-date { font-size: 11px; color: var(--t3); margin-top: 5px; }
.pip-row { display: flex; gap: 3px; margin-top: 7px; }
.pip { height: 4px; border-radius: 2px; flex: 1; background: var(--s3); }

/* BADGES */
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 14px; border: 1px solid; }
.s-발굴 { color: #9898e8; border-color: #9898e8; background: rgba(152,152,232,.12); }
.s-검토 { color: #60b8f8; border-color: #60b8f8; background: rgba(96,184,248,.12); }
.s-협의 { color: #d8b848; border-color: #d8b848; background: rgba(216,184,72,.12); }
.s-구조화 { color: #c868e8; border-color: #c868e8; background: rgba(200,104,232,.12); }
.s-실행 { color: #40c888; border-color: #40c888; background: rgba(64,200,136,.12); }
.s-클로징 { color: var(--gold); border-color: var(--gold); background: var(--gdim); }
.s-완료 { color: var(--green); border-color: var(--green); background: rgba(80,192,128,.12); }
.s-중단 { color: var(--red); border-color: var(--red); background: rgba(224,104,104,.12); }
.t-MA { color: #70a8f8; border-color: #70a8f8; background: rgba(112,168,248,.12); }
.t-fund { color: var(--gold); border-color: var(--gold); background: var(--gdim); }
.t-re { color: var(--green); border-color: var(--green); background: rgba(80,192,128,.12); }
.t-ipo { color: #c868e8; border-color: #c868e8; background: rgba(200,104,232,.12); }
.t-trade { color: #40d0d8; border-color: #40d0d8; background: rgba(64,208,216,.12); }
.t-ent { color: #e868b0; border-color: #e868b0; background: rgba(232,104,176,.12); }
.t-etc { color: #8098b8; border-color: #8098b8; background: rgba(128,152,184,.12); }

/* EMPTY */
.empty { text-align: center; padding: 60px 24px; color: var(--t3); }
.empty-icon { font-size: 44px; margin-bottom: 14px; }
.empty p { font-size: 15px; line-height: 1.7; }

/* DEAL DETAIL */
.hero { padding: 16px; background: var(--s1); border-bottom: 1px solid var(--bd); }
.hero-name { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--tx); margin-bottom: 10px; line-height: 1.2; }
.hero-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
.hero-fee { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--gold); margin: 6px 0; }
.hero-desc { font-size: 15px; color: var(--t2); line-height: 1.6; margin-top: 8px; }
.sdots { display: flex; gap: 5px; margin: 8px 0 4px; }
.sdot { width: 9px; height: 9px; border-radius: 50%; background: var(--s3); }
.sdot.done { background: var(--gold); }
.sdot.cur { background: var(--gold); box-shadow: 0 0 0 3px var(--gdim); }
.stage-label { font-size: 13px; color: var(--t2); }

/* SECTION */
.sec { border-bottom: 1px solid var(--bd); }
.sec-hdr { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; }
.sec-hdr:active { background: var(--s2); }
.sec-hl { display: flex; align-items: center; gap: 9px; }
.sec-icon { font-size: 18px; }
.sec-title { font-size: 16px; font-weight: 600; color: var(--tx); }
.sec-cnt { font-size: 12px; color: var(--t3); background: var(--s3); padding: 2px 8px; border-radius: 10px; }
.sec-body { padding: 0 16px 14px; display: none; }
.sec-body.open { display: block; }
.add-btn { display: flex; align-items: center; gap: 6px; padding: 10px 0; font-size: 15px; color: var(--gold); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; }

/* TIMELINE */
.tl-item { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--bd); }
.tl-item:last-of-type { border-bottom: none; }
.tl-line { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); margin-top: 4px; flex-shrink: 0; }
.tl-track { width: 2px; background: var(--bd); flex: 1; margin-top: 4px; }
.tl-content { flex: 1; }
.tl-date { font-size: 12px; color: var(--t3); margin-bottom: 4px; }
.tl-text { font-size: 15px; color: var(--tx); line-height: 1.55; }
.tl-who { font-size: 13px; color: var(--gold); margin-top: 5px; }
.tl-del { background: none; border: none; color: var(--t3); font-size: 12px; cursor: pointer; margin-top: 4px; font-family: 'DM Sans', sans-serif; }

/* PEOPLE CHIPS */
.pchips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.pchip { display: flex; align-items: center; gap: 8px; background: var(--s2); border: 1px solid var(--bd); border-radius: 12px; padding: 9px 12px; cursor: pointer; }
.pchip:active { border-color: var(--gold); }
.pav { width: 32px; height: 32px; border-radius: 50%; background: var(--gdim); border: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--gold); flex-shrink: 0; }
.pchip-name { font-size: 15px; font-weight: 500; }
.pchip-role { font-size: 12px; color: var(--t2); }

/* ACTION ITEMS */
.act-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bd); }
.act-item:last-of-type { border-bottom: none; }
.acheck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bd); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.acheck.done { border-color: var(--green); background: var(--green); }
.acheck.done::after { content: '✓'; font-size: 12px; color: #1c2130; font-weight: 700; }
.atxt { flex: 1; }
.atitle { font-size: 15px; color: var(--tx); }
.atitle.done { text-decoration: line-through; color: var(--t3); }
.adue { font-size: 13px; color: var(--t3); margin-top: 3px; }
.adue.over { color: var(--red); }
.xbtn { background: none; border: none; color: var(--t3); cursor: pointer; padding: 4px; display: flex; align-items: center; }

/* DOCS */
.doc-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bd); }
.doc-item:last-of-type { border-bottom: none; }
.doc-ico { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.doc-ico.link { background: rgba(96,160,232,.15); }
.doc-ico.photo { background: rgba(80,192,128,.15); }
.doc-info { flex: 1; overflow: hidden; }
.doc-name { font-size: 15px; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-type { font-size: 12px; color: var(--t3); margin-top: 2px; }
.doc-open { color: var(--blue); font-size: 13px; padding: 5px 12px; background: rgba(96,160,232,.1); border-radius: 7px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }

/* PHOTO GRID */
.photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 10px; }
.photo-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--s3); cursor: pointer; position: relative; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.6); border: none; color: white; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* RESEARCH */
.res-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bd); }
.res-item:last-of-type { border-bottom: none; }

/* STAGE BUTTONS */
.stage-btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; }
.sbtn { padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; background: var(--s2); border: 1px solid var(--bd); color: var(--t2); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.sbtn.cur { background: var(--gdim); border-color: var(--gold); color: var(--gold); }

/* PEOPLE LIST */
.person-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--bd); cursor: pointer; }
.person-row:active { background: var(--s2); }
.pav-lg { width: 44px; height: 44px; border-radius: 50%; background: var(--gdim); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: var(--gold); flex-shrink: 0; }
.prow-name { font-size: 17px; font-weight: 600; }
.prow-sub { font-size: 13px; color: var(--t2); margin-top: 3px; }
.prow-dc { font-size: 12px; color: var(--gold); margin-top: 3px; }

/* PERSON DETAIL */
.phero { padding: 20px 16px; background: var(--s1); border-bottom: 1px solid var(--bd); text-align: center; }
.pav-xl { width: 68px; height: 68px; border-radius: 50%; background: var(--gdim); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: var(--gold); margin: 0 auto 12px; }
.phero-name { font-family: 'DM Serif Display', serif; font-size: 22px; }
.phero-sub { font-size: 14px; color: var(--t2); margin-top: 5px; }
.stars { display: flex; gap: 5px; justify-content: center; margin-top: 9px; }
.star { font-size: 20px; color: var(--t3); cursor: pointer; }
.star.on { color: var(--gold); }
.irow { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--bd); }
.iico { width: 28px; font-size: 16px; text-align: center; flex-shrink: 0; }
.ival { flex: 1; font-size: 15px; }
.icopy { background: none; border: none; color: var(--t3); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 4px 8px; }

/* DASHBOARD */
.dash-fee { padding: 18px 16px; background: var(--s1); border-bottom: 1px solid var(--bd); }
.dash-fee-label { font-size: 12px; color: var(--t3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
.dash-fee-val { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--gold); }
.dash-sec { padding: 14px 16px 6px; }
.dash-sec-title { font-size: 12px; color: var(--t3); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; margin-bottom: 12px; }
.sbar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.sbar-label { font-size: 14px; color: var(--t2); width: 48px; flex-shrink: 0; }
.sbar-track { flex: 1; background: var(--s3); border-radius: 3px; height: 6px; }
.sbar-fill { height: 100%; border-radius: 3px; background: var(--gold); }
.sbar-n { font-size: 13px; color: var(--t3); width: 18px; text-align: right; flex-shrink: 0; }
.dash-act-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--bd); cursor: pointer; }
.dash-act-row:active { background: var(--s2); }
.dash-deal-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--bd); cursor: pointer; }
.dash-deal-row:active { background: var(--s2); }
.ddot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* TODO TAB */
.todo-section { padding: 12px 16px 4px; font-size: 12px; color: var(--t3); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.todo-item { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--bd); cursor: pointer; }
.todo-item:active { background: var(--s2); }
.todo-deal { font-size: 12px; color: var(--gold); margin-top: 3px; }

/* MODAL */
#moverlay { position: fixed; inset: 0; background: rgba(0,0,0,.78); z-index: 900; display: none; align-items: flex-end; }
#moverlay.open { display: flex; }
#mbox { background: var(--s1); border-radius: 22px 22px 0 0; width: 100%; padding: 22px 20px calc(22px + var(--SAB)); max-height: 90vh; overflow-y: auto; }
#mbox::-webkit-scrollbar { display: none; }
.mtitle { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 16px; }
.macts { display: flex; gap: 10px; margin-top: 18px; }
.macts .btn { flex: 1; }

/* FORMS */
label { font-size: 12px; color: var(--t2); display: block; margin-bottom: 6px; margin-top: 16px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
label:first-child { margin-top: 0; }
input, textarea, select { background: var(--s2); border: 1px solid var(--bd); border-radius: 11px; color: var(--tx); font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 12px 14px; width: 100%; outline: none; transition: border-color .18s; }
input:focus, textarea:focus, select:focus { border-color: var(--gold); }
select option { background: var(--s2); }
textarea { resize: none; line-height: 1.6; }
.btn { background: var(--gold); color: #1c2130; border: none; border-radius: 11px; padding: 13px 20px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn:active { opacity: .8; }
.btn-g { background: var(--s2); color: var(--t2); border: 1px solid var(--bd); border-radius: 11px; padding: 13px 20px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; }
.delbtn { background: rgba(224,104,104,.1); color: var(--red); border: 1px solid rgba(224,104,104,.25); border-radius: 9px; padding: 9px 16px; font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; }

/* PHOTO VIEWER */
#photoViewer { position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 950; display: none; align-items: center; justify-content: center; }
#photoViewer.open { display: flex; }
#photoViewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
#photoViewer button { position: absolute; top: calc(20px + var(--SAT)); right: 20px; background: rgba(255,255,255,.2); border: none; color: white; font-size: 24px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* SETTINGS */
.sset { padding: 16px; border-bottom: 1px solid var(--bd); }
.stitle { font-size: 12px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; font-weight: 600; }
.syncmsg { font-size: 13px; color: var(--t3); margin-top: 10px; }

.swipe-hint { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--t3); padding: 6px 16px; border-bottom: 1px solid var(--bd); flex-shrink: 0; }
</style>
</head>
<body>
<div id="update-banner" onclick="location.reload(true)" style="display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:var(--gold);color:#1c2130;padding:calc(10px + var(--SAT)) 16px 10px;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:DM Sans,sans-serif;font-size:14px;font-weight:600;">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
  <span>새 버전 확인 중...</span>
</div>
<div id="stack">

  <!-- L1: MAIN -->
  <div class="layer base" id="l1">
    <div class="topbar">
      <div class="topbar-inner">
        <h1>My Project</h1>
      </div>
    </div>
    <!-- CAT TABS -->
    <div class="cat-tabs" id="cat-tabs">
      <div class="cat-tab on" onclick="setCat('important')">⭐ 중요</div>
      <div class="cat-tab" onclick="setCat('normal')">일반</div>
      <div class="cat-tab" onclick="setCat('hold')">보류</div>
      <div class="cat-tab" onclick="setCat('drop')">폐기</div>
    </div>
    <div class="lbody" id="deal-list-body"></div>
    <div id="tabbar">
      <button class="tab-btn on" id="tb-deals" onclick="switchTab('deals')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>딜
      </button>
      <button class="tab-btn" id="tb-todo" onclick="switchTab('todo')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>할일
      </button>
      <button class="tab-btn" id="tb-people" onclick="switchTab('people')">

<script>
var APP_VERSION = '4.1';

function checkUpdate(){
  fetch('https://api.github.com/repos/kjsh1028/myproject/contents/index.html',{headers:{'Cache-Control':'no-cache'}})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    if(!j) return;
    var raw = decodeURIComponent(escape(atob(j.content.replace(/
/g,''))));
    var m = raw.match(/var APP_VERSION = '([^']+)'/);
    if(!m) return;
    var remoteVer = m[1];
    if(remoteVer !== APP_VERSION){
      var banner = document.getElementById('update-banner');
      if(banner){
        banner.style.display='flex';
        banner.querySelector('span').textContent = 'v'+remoteVer+' 업데이트 → 탭해서 적용';
      }
    }
  })
  .catch(function(){});
}

var STAGES = ['발굴','검토','협의','구조화','실행','클로징','완료','중단'];
var ASTAGES = ['발굴','검토','협의','구조화','실행','클로징'];
var TYPES = ['M&A','자금조달','부동산','IPO·상장','무역','엔터테인먼트','기타'];
var CATS = {important:'중요', normal:'일반', hold:'보류', drop:'폐기'};
var ROLES = ['매수인','매도인','투자자','투자대상','FA','법무','회계','주관사','파트너','기타'];
var DTYPES = ['NDA','IM','Term Sheet','계약서','보고서','재무제표','법인등기','리서치','기타'];

var DB = {deals:[], people:[]};
var SETS = {};
var curDeal = null;
var curPerson = null;
var curTab = 'deals';
var curCat = 'important';
var layers = ['l1'];
var openSec = {};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){
  if(!s) return '';
  var d = new Date(s+'T12:00:00');
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}
function dLeft(s){
  if(!s) return null;
  return Math.ceil((new Date(s+'T12:00:00')-new Date())/86400000);
}
function fmtFee(n){
  if(!n||isNaN(n)) return '미정';
  n=parseInt(n);
  if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if(n>=10000) return Math.round(n/10000)+'만';
  return n.toLocaleString();
}
function tclass(t){
  var m={'M&A':'MA','자금조달':'fund','부동산':'re','IPO·상장':'ipo','무역':'trade','엔터테인먼트':'ent','기타':'etc'};
  return 't-'+(m[t]||'etc');
}
function sdotColor(s){
  var m={'발굴':'#9898e8','검토':'#60b8f8','협의':'#d8b848','구조화':'#c868e8','실행':'#40c888','클로징':'#d4a84b','완료':'#50c080','중단':'#e06868'};
  return m[s]||'#6070a0';
}

function load(){
  try{ var d=localStorage.getItem('mp4_db'); if(d) DB=JSON.parse(d); }catch(e){}
  try{ var s=localStorage.getItem('mp4_set'); if(s) SETS=JSON.parse(s); }catch(e){}
  // migrate from old key
  if(!DB.deals||DB.deals.length===0){
    try{ var old=localStorage.getItem('mp2_db'); if(old){ var od=JSON.parse(old); if(od.deals&&od.deals.length){ DB=od; save(); } } }catch(e){}
  }
  if(!DB.deals) DB.deals=[];
  if(!DB.people) DB.people=[];
  DB.deals.forEach(function(d){ if(!d.category) d.category='important'; });
}
function save(){ localStorage.setItem('mp4_db',JSON.stringify(DB)); }

function pushGH(){
  var tok=document.getElementById('s-tok').value.trim();
  var repo=document.getElementById('s-repo').value.trim();
  var file=document.getElementById('s-file').value.trim();
  SETS.tok=tok; SETS.repo=repo; SETS.file=file;
  localStorage.setItem('mp4_set',JSON.stringify(SETS));
  if(!tok||!repo||!file){ setSyncMsg('❌ 토큰, repo, 파일명을 입력하세요'); return; }
  setSyncMsg('저장 중...');
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(DB,null,2))));
  fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{headers:{'Authorization':'token '+tok}})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    var body={message:'update '+new Date().toISOString(),content:content};
    if(j&&j.sha) body.sha=j.sha;
    return fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{method:'PUT',headers:{'Authorization':'token '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)});
  })
  .then(function(r){ setSyncMsg(r.ok?'✅ 저장 완료 '+new Date().toLocaleTimeString():'❌ 실패 '+r.status); })
  .catch(function(e){ setSyncMsg('❌ '+e.message); });
}
function pullGH(){
  var tok=document.getElementById('s-tok').value.trim();
  var repo=document.getElementById('s-repo').value.trim();
  var file=document.getElementById('s-file').value.trim();
  SETS.tok=tok; SETS.repo=repo; SETS.file=file;
  localStorage.setItem('mp4_set',JSON.stringify(SETS));
  if(!tok||!repo||!file){ setSyncMsg('❌ 토큰, repo, 파일명을 입력하세요'); return; }
  setSyncMsg('불러오는 중...');
  fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{headers:{'Authorization':'token '+tok}})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    if(!j){ setSyncMsg('❌ 실패'); return; }
    var data=JSON.parse(decodeURIComponent(escape(atob(j.content))));
    DB=data;
    if(!DB.deals) DB.deals=[];
    if(!DB.people) DB.people=[];
    DB.deals.forEach(function(d){ if(!d.category) d.category='important'; });
    save(); renderAll(); setSyncMsg('✅ 불러오기 완료');
  })
  .catch(function(e){ setSyncMsg('❌ '+e.message); });
}
function setSyncMsg(m){ var el=document.getElementById('syncmsg'); if(el) el.textContent=m; }
function exportData(){ var b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='myproject.json'; a.click(); }
function clearAll(){ if(confirm('모든 데이터를 삭제합니까?')){ DB={deals:[],people:[]}; save(); renderAll(); } }

/* NAV */
function pushLayer(id){
  var prev=layers[layers.length-1];
  document.getElementById(prev).classList.add('behind');
  document.getElementById(id).classList.add('active');
  layers.push(id);
}
function popLayer(){
  if(layers.length<=1) return;
  var top=layers.pop();
  var el=document.getElementById(top);
  el.classList.remove('active','behind');
  el.style.transform='';
  document.getElementById(layers[layers.length-1]).classList.remove('behind');
}
function initSwipe(el){
  var sx=0,drag=false;
  el.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; drag=sx<44; },{passive:true});
  el.addEventListener('touchmove',function(e){ if(!drag) return; var dx=e.touches[0].clientX-sx; if(dx>0) el.style.transform='translateX('+dx+'px)'; },{passive:true});
  el.addEventListener('touchend',function(e){ if(!drag) return; var dx=e.changedTouches[0].clientX-sx; el.style.transform=''; if(dx>80) popLayer(); drag=false; },{passive:true});
}

/* TABS */
function switchTab(tab){
  curTab=tab;
  var tabs=['deals','todo','people','dash'];
  var catTabs=document.getElementById('cat-tabs');
  var fab=document.getElementById('l1fab');
  var dlb=document.getElementById('deal-list-body');
  catTabs.style.display=(tab==='deals'?'flex':'none');
  if(tab==='deals'){ renderDeals(); dlb.style.display=''; }
  else if(tab==='todo'){ renderTodo(); dlb.innerHTML=''; }
  else if(tab==='people'){ renderPeopleList(); dlb.innerHTML=''; }
  else if(tab==='dash'){ renderDash(); dlb.innerHTML=''; }
  if(tab==='deals'||tab==='people') fab.style.display='flex';
  else fab.style.display='none';
  tabs.forEach(function(t){ document.getElementById('tb-'+t).classList.toggle('on',t===tab); });
}

function setCat(cat){
  curCat=cat;
  document.querySelectorAll('.cat-tab').forEach(function(el,i){
    el.classList.toggle('on',['important','normal','hold','drop'][i]===cat);
  });
  renderDeals();
}

/* RENDER DEALS */
function renderDeals(){
  var deals=DB.deals.filter(function(d){ return (d.category||'important')===curCat; });
  deals.sort(function(a,b){
    var si=function(d){ return STAGES.indexOf(d.stage); };
    if(si(a)!==si(b)) return si(a)-si(b);
    return (b.updatedAt||'')>(a.updatedAt||'')?1:-1;
  });
  if(!deals.length){
    var labels={important:'중요',normal:'일반',hold:'보류',drop:'폐기'};
    document.getElementById('deal-list-body').innerHTML='<div class="empty"><div class="empty-icon">'+(curCat==='important'?'⭐':curCat==='normal'?'📋':curCat==='hold'?'⏸':'🗑')+'</div><p>'+labels[curCat]+' 딜이 없습니다</p></div>';
    return;
  }
  var html='';
  for(var i=0;i<deals.length;i++){
    var d=deals[i];
    var ppl=(d.personIds||[]).slice(0,2).map(function(pid){ return DB.people.find(function(p){ return p.id===pid; }); }).filter(Boolean);
    var color=sdotColor(d.stage);
    var si=ASTAGES.indexOf(d.stage);
    var pips='';
    for(var j=0;j<ASTAGES.length;j++) pips+='<div class="pip" style="background:'+(j<=si?color:'var(--s3)')+'"></div>';
    var nextAct=(d.actions||[]).find(function(a){ return !a.done; });
    var tl=d.timeline||[];
    var lastMtg=tl.length?fmtDate(tl[tl.length-1].date):'';
    html+='<div class="deal-card" onclick="openDeal(\''+d.id+'\')">';
    html+='<div class="deal-left">';
    html+='<div class="deal-name">'+d.name+'</div>';
    html+='<div class="deal-meta"><span class="badge '+tclass(d.type)+'">'+d.type+'</span><span class="badge s-'+d.stage+'">'+d.stage+'</span>';
    for(var k=0;k<ppl.length;k++) html+='<span style="font-size:13px;color:var(--t2)">'+ppl[k].name+'</span>';
    html+='</div>';
    html+='<div class="pip-row">'+pips+'</div>';
    if(nextAct) html+='<div class="deal-next">'+nextAct.title+'</div>';
    html+='</div>';
    html+='<div class="deal-right"><div class="deal-fee">'+fmtFee(parseInt(d.fee)||0)+'</div>';
    if(lastMtg) html+='<div class="deal-date">미팅 '+lastMtg+'</div>';
    html+='</div>';
    html+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3);flex-shrink:0;margin-top:4px"><path d="M9 18l6-6-6-6"/></svg>';
    html+='</div>';
  }
  document.getElementById('deal-list-body').innerHTML=html;
}

/* RENDER TODO */
function renderTodo(){
  var allActs=[];
  DB.deals.forEach(function(d){
    (d.actions||[]).forEach(function(a,i){
      if(!a.done) allActs.push({a:a,idx:i,dealName:d.name,dealId:d.id,cat:d.category||'important'});
    });
  });
  allActs.sort(function(x,y){ return (x.a.due||'9')>(y.a.due||'9')?1:-1; });
  if(!allActs.length){
    document.getElementById('deal-list-body').innerHTML='<div class="empty"><div class="empty-icon">✅</div><p>할일이 없습니다</p></div>';
    return;
  }
  var overdue=allActs.filter(function(x){ var dl=dLeft(x.a.due); return dl!==null&&dl<0; });
  var today_=allActs.filter(function(x){ return dLeft(x.a.due)===0; });
  var upcoming=allActs.filter(function(x){ var dl=dLeft(x.a.due); return dl===null||dl>0; });
  var html='';
  function renderGroup(title,items){
    if(!items.length) return '';
    var h='<div class="todo-section">'+title+'</div>';
    for(var i=0;i<items.length;i++){
      var item=items[i];
      var dl=dLeft(item.a.due);
      var dueTxt=dl===null?'':dl===0?'오늘':dl<0?Math.abs(dl)+'일 초과':'D-'+dl;
      h+='<div class="todo-item" onclick="openDeal(\''+item.dealId+'\')">';
      h+='<div class="acheck"></div>';
      h+='<div class="atxt"><div class="atitle">'+item.a.title+'</div>';
      h+='<div class="todo-deal">'+item.dealName+(item.a.due?' · <span style="color:'+(dl<0?'var(--red)':dl===0?'var(--orange)':'var(--t3)')+'">'+dueTxt+'</span>':'')+'</div>';
      h+='</div></div>';
    }
    return h;
  }
  html+=renderGroup('⚠️ 기한 초과',overdue);
  html+=renderGroup('📅 오늘',today_);
  html+=renderGroup('📋 예정',upcoming);
  document.getElementById('deal-list-body').innerHTML=html;
}

/* RENDER PEOPLE LIST */
function renderPeopleList(){
  var people=[].concat(DB.people).sort(function(a,b){ return a.name<b.name?-1:1; });
  if(!people.length){
    document.getElementById('deal-list-body').innerHTML='<div class="empty"><div class="empty-icon">👤</div><p>고객이 없습니다<br>+ 버튼으로 추가하세요</p></div>';
    return;
  }
  var html='';
  for(var i=0;i<people.length;i++){
    var p=people[i];
    var dc=DB.deals.filter(function(d){ return (d.personIds||[]).indexOf(p.id)>=0; }).length;
    var stars='';
    for(var j=1;j<=5;j++) stars+='<span style="color:'+((p.rating||0)>=j?'var(--gold)':'var(--t3)')+';font-size:14px">★</span>';
    html+='<div class="person-row" onclick="openPerson(\''+p.id+'\')">';
    html+='<div class="pav-lg">'+p.name.slice(-1)+'</div>';
    html+='<div style="flex:1"><div class="prow-name">'+p.name+'</div>';
    html+='<div class="prow-sub">'+(p.org||'')+(p.title?' · '+p.title:'')+'</div>';
    if(dc) html+='<div class="prow-dc">'+dc+'개 딜 참여</div>';
    html+='</div>';
    html+='<div style="text-align:right"><div>'+stars+'</div>';
    if(p.role) html+='<div style="font-size:12px;color:var(--t2);margin-top:4px">'+p.role+'</div>';
    html+='</div>';
    html+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3)"><path d="M9 18l6-6-6-6"/></svg>';
    html+='</div>';
  }
  document.getElementById('deal-list-body').innerHTML=html;
}

/* RENDER DASH */
function renderDash(){
  var active=DB.deals.filter(function(d){ return d.stage!=='완료'&&d.stage!=='중단'; });
  var fee=active.reduce(function(a,d){ return a+(parseInt(d.fee)||0); },0);
  var doneFee=DB.deals.filter(function(d){ return d.stage==='완료'; }).reduce(function(a,d){ return a+(parseInt(d.fee)||0); },0);
  var html='<div class="dash-fee"><div class="dash-fee-label">예상 성공보수</div><div class="dash-fee-val">'+(fee?fmtFee(fee):'—')+'</div>';
  if(doneFee) html+='<div style="font-size:14px;color:var(--green);margin-top:6px">완료 수령 '+fmtFee(doneFee)+'</div>';
  html+='</div>';
  html+='<div class="dash-sec"><div class="dash-sec-title">단계별 현황</div>';
  var maxN=1, cnts={};
  for(var i=0;i<STAGES.length;i++) cnts[STAGES[i]]=DB.deals.filter(function(d){ return d.stage===STAGES[i]; }).length;
  for(var s in cnts) if(cnts[s]>maxN) maxN=cnts[s];
  for(var i=0;i<STAGES.length;i++){
    var s=STAGES[i],n=cnts[s];
    html+='<div class="sbar-row"><div class="sbar-label">'+s+'</div><div class="sbar-track"><div class="sbar-fill" style="width:'+Math.round(n/maxN*100)+'%"></div></div><div class="sbar-n">'+n+'</div></div>';
  }
  html+='</div>';
  var allActs=[];
  DB.deals.forEach(function(d){ (d.actions||[]).filter(function(a){ return !a.done&&a.due; }).forEach(function(a){ allActs.push({a:a,dealName:d.name,dealId:d.id}); }); });
  allActs.sort(function(x,y){ return x.a.due<y.a.due?-1:1; });
  if(allActs.length){
    html+='<div class="dash-sec"><div class="dash-sec-title">예정 액션</div></div>';
    for(var i=0;i<Math.min(allActs.length,5);i++){
      var item=allActs[i]; var dl=dLeft(item.a.due);
      var over=dl!==null&&dl<0;
      var dueTxt=dl===0?'<span style="color:var(--gold)">오늘</span>':over?'<span style="color:var(--red)">'+Math.abs(dl)+'일 초과</span>':'D-'+dl;
      html+='<div class="dash-act-row" onclick="openDeal(\''+item.dealId+'\')">';
      html+='<div class="acheck"></div><div class="atxt"><div class="atitle">'+item.a.title+'</div><div class="adue">'+item.dealName+' · '+dueTxt+'</div></div></div>';
    }
  }
  var recent=[].concat(DB.deals).sort(function(a,b){ return (b.updatedAt||'')>(a.updatedAt||'')?1:-1; }).slice(0,4);
  if(recent.length){
    html+='<div class="dash-sec"><div class="dash-sec-title">최근 업데이트</div></div>';
    for(var i=0;i<recent.length;i++){
      var d=recent[i];
      html+='<div class="dash-deal-row" onclick="openDeal(\''+d.id+'\')">';
      html+='<div class="ddot" style="background:'+sdotColor(d.stage)+'"></div>';
      html+='<div style="flex:1"><div style="font-size:16px;font-weight:500">'+d.name+'</div><div style="font-size:13px;color:var(--t2);margin-top:3px">'+d.type+' · '+d.stage+'</div></div>';
      html+='<span class="badge s-'+d.stage+'">'+d.stage+'</span></div>';
    }
  }
  document.getElementById('deal-list-body').innerHTML=html;

  html+='</div>';

  // STAGE

    var s='<div class="stage-btns">';

  // TIMELINE

      s+='<div class="tl-content"><div class="tl-date">'+fmtDate(l.date)+(l.channel?' · '+l.channel:'')+'</div>';
      s+='<div class="tl-text">'+l.content.replace(/\n/g,'<br>')+'</div>';

    }

  });

  // PEOPLE
  html+=makeSec('people','👥','관련자',ppl.length,sec.people,function(){
    var s='<div class="pchips">';

      var p=ppl[i];
      s+='<div class="pchip" onclick="openPerson(\''+p.id+'\')"><div class="pav">'+p.name.slice(-1)+'</div><div><div class="pchip-name">'+p.name+'</div><div class="pchip-role">'+(p.role||p.org||'')+'</div></div></div>';
    }
    s+='</div><button class="add-btn" onclick="openLinkPerson()">+ 관련자 연결</button>';
    return s;
  });

  // ACTIONS
  html+=makeSec('actions','✅','액션 아이템',openActs,sec.actions,function(){
    var s='';
    for(var i=0;i<acts.length;i++){
      var a=acts[i], dl=dLeft(a.due), over=dl!==null&&dl<0&&!a.done;
      s+='<div class="act-item"><div class="acheck '+(a.done?'done':'')+'" onclick="togAct('+i+')"></div>';

      if(a.due) s+='<div class="adue '+(over?'over':'')+'">'+fmtDate(a.due)+(dl!==null&&!a.done?' (D'+(dl>=0?'-'+dl:'+'+Math.abs(dl))+')':'')+'</div>';
      if(a.note) s+='<div style="font-size:13px;color:var(--t3);margin-top:3px">'+a.note+'</div>';
      s+='</div><button class="xbtn" onclick="delAct('+i+')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
    }
    s+='<button class="add-btn" onclick="openAddAct()">+ 액션 추가</button>';
    return s;
  });

  // DOCS & PHOTOS
  html+=makeSec('docs','📂','문서 / 사진',docs.length,sec.docs,function(){
    var photos=docs.filter(function(x){ return x.type==='photo'; });
    var links=docs.filter(function(x){ return x.type!=='photo'; });
    var s='';

      s+='<button class="doc-open" onclick="window.open(\''+lk.url+'\',\'_blank\')">열기</button>';
      s+='<button class="xbtn" style="margin-left:4px" onclick="delDoc('+li+')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
    }
    s+='<div style="display:flex;gap:10px;margin-top:4px">';
    s+='<button class="add-btn" onclick="openAddDoc()">+ Drive 링크</button>';
    s+='<button class="add-btn" onclick="openAddPhoto()">📷 사진 추가</button>';
    s+='</div>';
    return s;
  });

  // RESEARCH
  html+=makeSec('research','🔍','리서치',research.length,sec.research,function(){
    var s='';
    for(var i=0;i<research.length;i++){
      var r=research[i];
      s+='<div class="res-item"><div class="doc-ico link" style="font-size:16px">🔗</div>';
      s+='<div class="doc-info"><div class="doc-name">'+r.title+'</div><div class="doc-type">'+(r.note||'')+'</div></div>';
      s+='<button class="doc-open" onclick="window.open(\''+r.url+'\',\'_blank\')">열기</button>';
      s+='<button class="xbtn" style="margin-left:4px" onclick="delRes('+i+')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
    }
    s+='<button class="add-btn" onclick="openAddRes()">+ 리서치 링크</button>';
    return s;
  });

  html+='<div style="padding:18px 16px 30px;display:flex;gap:10px">';
  html+='<button class="delbtn" onclick="delDeal()">딜 삭제</button>';
  html+='</div>';
  document.getElementById('l2body').innerHTML=html;
}

function makeSec(key,icon,title,cnt,isOpen,bodyFn){
  var h='<div class="sec"><div class="sec-hdr" onclick="toggleSec(\''+key+'\')">';
  h+='<div class="sec-hl"><span class="sec-icon">'+icon+'</span><span class="sec-title">'+title+'</span>';
  if(cnt!=='') h+='<span class="sec-cnt">'+cnt+'</span>';
  h+='</div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3);transform:rotate('+(isOpen?'180':'0')+'deg);transition:transform .2s"><path d="M6 9l6 6 6-6"/></svg>';
  h+='</div><div class="sec-body '+(isOpen?'open':'')+'">'+bodyFn()+'</div></div>';
  return h;
}
function toggleSec(k){ if(!openSec[curDeal]) openSec[curDeal]={}; openSec[curDeal][k]=!openSec[curDeal][k]; renderL2(); }
function chStage(s){ var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d||d.stage===s) return; if(!d.stageHistory) d.stageHistory=[]; d.stageHistory.push({from:d.stage,to:s,date:today()}); d.stage=s; d.updatedAt=today(); save(); renderL2(); renderDeals(); }
function delDeal(){ if(!confirm('딜을 삭제합니까?')) return; DB.deals=DB.deals.filter(function(d){ return d.id!==curDeal; }); save(); popLayer(); renderDeals(); }
function togAct(i){ var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; d.actions[i].done=!d.actions[i].done; d.updatedAt=today(); save(); renderL2(); }
function delAct(i){ var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; d.actions.splice(i,1); save(); renderL2(); }
function delTL(i){ var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; d.timeline.splice(i,1); save(); renderL2(); }
function delDoc(i){ var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; d.docs.splice(i,1); save(); renderL2(); }
function delRes(i){ var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; d.research.splice(i,1); save(); renderL2(); }

function viewPhoto(src){ document.getElementById('photoViewerImg').src=src; document.getElementById('photoViewer').classList.add('open'); }
function closePhoto(){ document.getElementById('photoViewer').classList.remove('open'); }

function saveDeal(isEdit){
  var name=document.getElementById('fn').value.trim();
  if(!name){ alert('딜명을 입력하세요'); return; }
  if(isEdit){
    var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return;
    var os=d.stage,ns=document.getElementById('fs').value;
    d.name=name; d.category=document.getElementById('fcat').value; d.type=document.getElementById('ft').value; d.stage=ns;
    d.fee=document.getElementById('ff').value; d.country=document.getElementById('fc').value;

}

function openAddPersonModal(){ showModal('새 관련자',personFormHTML(null),[{label:'추가',fn:'savePerson(false)'},{label:'취소',fn:'closeModal()',g:true}]); }
function openEditPerson(){ var p=DB.people.find(function(x){ return x.id===curPerson; }); if(!p) return; showModal('관련자 수정',personFormHTML(p),[{label:'저장',fn:'savePerson(true)'},{label:'취소',fn:'closeModal()',g:true}]); }
function savePerson(isEdit){
  var name=document.getElementById('fpn').value.trim(); if(!name){ alert('이름을 입력하세요'); return; }
  var data={name:name,org:document.getElementById('fpo').value,title:document.getElementById('fpt').value,role:document.getElementById('fpr').value,phone:document.getElementById('fpph').value,email:document.getElementById('fpe').value,wechat:document.getElementById('fpw').value,country:document.getElementById('fpco').value,lang:document.getElementById('fpl').value,rating:parseInt(document.getElementById('fprat').value)||0,memo:document.getElementById('fpm').value};
  if(isEdit){ var p=DB.people.find(function(x){ return x.id===curPerson; }); if(p) Object.assign(p,data); }
  else { var np={id:uid(),logs:[],createdAt:today()}; Object.assign(np,data); DB.people.push(np); }
  save(); closeModal(); if(isEdit) renderL3(); renderPeopleList();
}

/* LINK PERSON */
function openLinkPerson(){
  var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return;
  var avail=DB.people.filter(function(p){ return (d.personIds||[]).indexOf(p.id)<0; });
  var h='';
  if(avail.length){ for(var i=0;i<avail.length;i++){ var p=avail[i]; h+='<div class="pchip" onclick="linkP(\''+p.id+'\')" style="width:100%;margin-bottom:10px"><div class="pav">'+p.name.slice(-1)+'</div><div><div class="pchip-name">'+p.name+'</div><div class="pchip-role">'+(p.org||'')+(p.title?' · '+p.title:'')+'</div></div></div>'; } }
  else h='<p style="font-size:15px;color:var(--t2);margin-bottom:14px">추가된 관련자가 없습니다</p>';
  h+='<button class="add-btn" style="margin-top:6px" onclick="closeModal();setTimeout(openAddAndLink,80)">+ 새 관련자 추가</button>';
  showModal('관련자 연결',h,[{label:'닫기',fn:'closeModal()',g:true}]);
}
function linkP(pid){ var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; if(!d.personIds) d.personIds=[]; if(d.personIds.indexOf(pid)<0){ d.personIds.push(pid); d.updatedAt=today(); save(); } closeModal(); renderL2(); }
function openAddAndLink(){ showModal('새 관련자',personFormHTML(null),[{label:'추가 후 연결',fn:'saveAndLink()'},{label:'취소',fn:'closeModal()',g:true}]); }
function saveAndLink(){ var name=document.getElementById('fpn').value.trim(); if(!name){ alert('이름을 입력하세요'); return; } var np={id:uid(),name:name,org:document.getElementById('fpo').value,title:document.getElementById('fpt').value,role:document.getElementById('fpr').value,phone:document.getElementById('fpph').value,email:document.getElementById('fpe').value,wechat:document.getElementById('fpw').value,country:document.getElementById('fpco').value,lang:document.getElementById('fpl').value,rating:parseInt(document.getElementById('fprat').value)||0,memo:document.getElementById('fpm').value,logs:[],createdAt:today()}; DB.people.push(np); var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(d){ if(!d.personIds) d.personIds=[]; d.personIds.push(np.id); d.updatedAt=today(); } save(); closeModal(); renderL2(); renderPeopleList(); }

/* ACTION / LOG / DOC / RESEARCH FORMS */
function openAddAct(){ showModal('액션 추가','<label>내용 *</label><input id="fan" placeholder="할 일"><label>기한</label><input id="fad" type="date" value="'+today()+'"><label>메모</label><input id="fam" placeholder="추가 메모...">',[{label:'추가',fn:'saveAct()'},{label:'취소',fn:'closeModal()',g:true}]); }

function openAddTL(){ showModal('미팅 / 로그 추가','<label>날짜</label><input id="fld" type="date" value="'+today()+'"><label>채널</label><input id="flc" placeholder="대면미팅, 전화, WeChat, 이메일..."><label>참석자</label><input id="flw" placeholder="홍길동, 김철수..."><label>내용 *</label><textarea id="flx" rows="5" placeholder="미팅 내용, 논의 사항, 결정된 것들..."></textarea>',[{label:'추가',fn:'saveTL()'},{label:'취소',fn:'closeModal()',g:true}]); }
function saveTL(){ var c=document.getElementById('flx').value.trim(); if(!c){ alert('내용을 입력하세요'); return; } var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; if(!d.timeline) d.timeline=[]; d.timeline.push({id:uid(),date:document.getElementById('fld').value,channel:document.getElementById('flc').value,who:document.getElementById('flw').value,content:c}); d.updatedAt=today(); save(); closeModal(); renderL2(); }

function openAddDoc(){ var to=''; for(var i=0;i<DTYPES.length;i++) to+='<option value="'+DTYPES[i]+'">'+DTYPES[i]+'</option>'; showModal('Drive 링크 추가','<label>문서명 *</label><input id="fdn" placeholder="NDA_홍콩코스메틱_2024"><label>문서 타입</label><select id="fdt">'+to+'</select><label>Google Drive URL *</label><input id="fdu" type="url" placeholder="https://drive.google.com/...">',[{label:'추가',fn:'saveDoc()'},{label:'취소',fn:'closeModal()',g:true}]); }
function saveDoc(){ var n=document.getElementById('fdn').value.trim(),u=document.getElementById('fdu').value.trim(); if(!n||!u){ alert('문서명과 URL을 입력하세요'); return; } var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; if(!d.docs) d.docs=[]; d.docs.push({id:uid(),name:n,url:u,docType:document.getElementById('fdt').value,type:'link'}); d.updatedAt=today(); save(); closeModal(); renderL2(); }

function openAddPhoto(){
  showModal('사진 추가',
    '<label>사진 선택</label><input type="file" id="fphoto" accept="image/*" style="padding:8px"><div id="photo-preview" style="margin-top:10px"></div>',
    [{label:'추가',fn:'savePhoto()'},{label:'취소',fn:'closeModal()',g:true}]);
  setTimeout(function(){
    document.getElementById('fphoto').addEventListener('change',function(e){
      var file=e.target.files[0]; if(!file) return;
      var reader=new FileReader();
      reader.onload=function(ev){ document.getElementById('photo-preview').innerHTML='<img src="'+ev.target.result+'" style="width:100%;border-radius:10px;max-height:200px;object-fit:cover">'; };
      reader.readAsDataURL(file);
    });
  },100);
}
function savePhoto(){
  var input=document.getElementById('fphoto'); if(!input||!input.files||!input.files[0]){ alert('사진을 선택하세요'); return; }
  var file=input.files[0];
  var reader=new FileReader();
  reader.onload=function(ev){
    var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return;
    if(!d.docs) d.docs=[];
    d.docs.push({id:uid(),name:file.name,data:ev.target.result,type:'photo'});
    d.updatedAt=today(); save(); closeModal(); renderL2();
  };
  reader.readAsDataURL(file);
}

function openAddRes(){ showModal('리서치 링크','<label>제목 *</label><input id="frn" placeholder="관련 기사, 리포트..."><label>URL *</label><input id="fru" type="url" placeholder="https://..."><label>메모</label><input id="frm" placeholder="참고사항...">',[{label:'추가',fn:'saveRes()'},{label:'취소',fn:'closeModal()',g:true}]); }
function saveRes(){ var n=document.getElementById('frn').value.trim(),u=document.getElementById('fru').value.trim(); if(!n||!u){ alert('제목과 URL을 입력하세요'); return; } var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; if(!d.research) d.research=[]; d.research.push({id:uid(),title:n,url:u,note:document.getElementById('frm').value}); d.updatedAt=today(); save(); closeModal(); renderL2(); }

function openAddPLog(){ showModal('대화 로그','<label>날짜</label><input id="fpld" type="date" value="'+today()+'"><label>채널</label><input id="fplc" placeholder="전화, 미팅, WeChat..."><label>내용 *</label><textarea id="fplx" rows="4"></textarea>',[{label:'추가',fn:'savePLog()'},{label:'취소',fn:'closeModal()',g:true}]); }

/* INIT */
function init(){
  load();
  ['l2','l3'].forEach(function(id){ initSwipe(document.getElementById(id)); });
  // Setup settings tab in l1
  var tabSet=document.getElementById('tb-dash').parentNode;
  // Override switchTab for 'set'
  var origSwitch=switchTab;
  window.switchTab=function(tab){
    if(tab==='set'){
      curTab='set';
      ['deals','todo','people','dash'].forEach(function(t){ document.getElementById('tb-'+t).classList.remove('on'); });
      document.getElementById('tb-dash').classList.remove('on');
      document.getElementById('cat-tabs').style.display='none';
      document.getElementById('l1fab').style.display='none';
      renderSettings();
      document.getElementById('deal-list-body').style.display='block';
      // no active tab highlight for settings - use dash btn as proxy
      return;
    }
    origSwitch(tab);
  };
  // add settings tab
  var setBtn=document.createElement('button');
  setBtn.className='tab-btn';
  setBtn.id='tb-set';
  setBtn.onclick=function(){ switchTab('set'); };
  setBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>설정';
  document.getElementById('tabbar').replaceChild(setBtn, document.getElementById('tb-dash'));
  // re-add dash btn
  var dashBtn=document.createElement('button');
  dashBtn.className='tab-btn';
  dashBtn.id='tb-dash';
  dashBtn.onclick=function(){ switchTab('dash'); };
  dashBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>현황';
  document.getElementById('tabbar').insertBefore(dashBtn, setBtn);
  renderDeals();
  if(SETS.tok&&SETS.repo&&SETS.file) pullGH();
  setTimeout(checkUpdate, 2000);
}
init();
