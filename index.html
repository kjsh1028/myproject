<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c8900a">
<meta name="apple-mobile-web-app-title" content="My Project">
<link rel="apple-touch-icon" href="icon.png">
<title>My Project</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f3f8;
  --s1: #ffffff;
  --s2: #f5f7fc;
  --s3: #e8ecf5;
  --bd: #d0d8ec;
  --gold: #b8860b;
  --gdim: rgba(184,134,11,0.10);
  --tx: #1a2340;
  --t2: #4a5878;
  --t3: #8090b0;
  --red: #d04040;
  --green: #2a9060;
  --blue: #3070c0;
  --SAT: env(safe-area-inset-top,0px);
  --SAB: env(safe-area-inset-bottom,0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--tx); font-family: 'DM Sans', sans-serif; overflow: hidden; }

/* APP SHELL */
#app { display: flex; flex-direction: column; height: 100dvh; }

/* TOPBAR */
.topbar { flex-shrink: 0; padding-top: var(--SAT); background: #2c3e6b; border-bottom: none; }
.topbar-inner { height: 54px; display: flex; align-items: center; padding: 0 14px; }
.topbar h1 { font-family: 'DM Serif Display', serif; font-size: 22px; color: #e8c96e; flex: 1; }
.topbar h2 { font-size: 17px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ffffff; }
.icon-btn { width: 42px; height: 42px; background: none; border: none; color: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; flex-shrink: 0; }

/* CATEGORY TABS */
.cat-bar { display: flex; background: #3a5080; border-bottom: none; flex-shrink: 0; }
.cat-tab { flex: 1; padding: 13px 4px; text-align: center; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.6); cursor: pointer; border-bottom: 2px solid transparent; }
.cat-tab.on { color: #e8c96e; border-bottom-color: #e8c96e; }

/* PAGES */
#pages { flex: 1; overflow: hidden; position: relative; }
.page { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: none; padding-bottom: calc(68px + var(--SAB)); }
.page.active { display: block; }
.page::-webkit-scrollbar { display: none; }
.page { background: var(--bg); }

/* TABBAR */
#tabbar { flex-shrink: 0; height: calc(68px + var(--SAB)); padding-bottom: var(--SAB); background: #ffffff; border-top: 1px solid #d0d8ec; display: flex; box-shadow: 0 -2px 12px rgba(44,62,107,0.08); }
.tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; color: var(--t3); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; }
.tab-btn svg { width: 24px; height: 24px; }
.tab-btn.on { color: #2c3e6b; }

/* FAB */
#fab { position: fixed; bottom: calc(68px + var(--SAB) + 18px); right: 18px; width: 56px; height: 56px; border-radius: 50%; background: #2c3e6b; color: #ffffff; border: none; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 20px rgba(44,62,107,.35); z-index: 99; }

/* UPDATE BANNER */
#update-banner { display: none; background: #2c3e6b; color: #ffffff; padding: 12px 16px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

/* DEAL DETAIL PAGE (full screen) */
#detail-page { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: none; flex-direction: column; }
#detail-page.show { display: flex; }
#detail-page .topbar-inner { padding: 0 8px 0 4px; }
#detail-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 30px; }
#detail-body::-webkit-scrollbar { display: none; }

/* PERSON PAGE */
#person-page { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: none; flex-direction: column; }
#person-page.show { display: flex; }
#person-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 30px; }
#person-body::-webkit-scrollbar { display: none; }

/* DEAL CARD */
.deal-card { padding: 16px; border-bottom: 1px solid var(--bd); display: flex; gap: 12px; align-items: flex-start; cursor: pointer; background: var(--s1); }
.deal-card:active { background: var(--s2); }
.deal-left { flex: 1; min-width: 0; }
.deal-name { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.deal-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.deal-next { font-size: 13px; color: var(--t2); }
.deal-next::before { content: '→ '; color: var(--gold); }
.deal-right { text-align: right; flex-shrink: 0; }
.deal-fee { font-size: 16px; color: var(--gold); font-weight: 600; }
.deal-date { font-size: 11px; color: var(--t3); margin-top: 4px; }
.pip-row { display: flex; gap: 3px; margin-top: 7px; }
.pip { height: 4px; border-radius: 2px; flex: 1; background: var(--s3); }

/* PERSON ROW */
.person-row { padding: 14px 16px; border-bottom: 1px solid var(--bd); display: flex; gap: 12px; align-items: center; cursor: pointer; }
.person-row:active { background: var(--s2); }
.pav { width: 44px; height: 44px; border-radius: 50%; background: rgba(44,62,107,0.1); border: 2px solid #2c3e6b; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #2c3e6b; flex-shrink: 0; }
.prow-name { font-size: 17px; font-weight: 600; }
.prow-sub { font-size: 13px; color: var(--t2); margin-top: 3px; }
.prow-dc { font-size: 12px; color: var(--gold); margin-top: 3px; }

/* DASHBOARD */
.dash-block { padding: 16px; border-bottom: 1px solid var(--bd); }
.dash-label { font-size: 12px; color: var(--t3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
.dash-val { font-family: 'DM Serif Display', serif; font-size: 30px; color: var(--gold); }
.sbar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.sbar-label { font-size: 14px; color: var(--t2); width: 48px; flex-shrink: 0; }
.sbar-track { flex: 1; background: var(--s3); border-radius: 3px; height: 6px; }
.sbar-fill { height: 100%; border-radius: 3px; background: var(--gold); }
.sbar-n { font-size: 13px; color: var(--t3); width: 20px; text-align: right; }

/* TODO */
.todo-sec-title { padding: 12px 16px 4px; font-size: 12px; color: var(--t3); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.todo-row { padding: 13px 16px; border-bottom: 1px solid var(--bd); display: flex; gap: 12px; cursor: pointer; }
.todo-row:active { background: var(--s2); }

/* HERO */
.hero { padding: 16px; background: #2c3e6b; border-bottom: none; }
.hero-name { font-family: 'DM Serif Display', serif; font-size: 24px; margin-bottom: 10px; line-height: 1.2; color: #ffffff; }
.hero-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
.hero-fee { font-family: 'DM Serif Display', serif; font-size: 26px; color: #e8c96e; margin: 6px 0; }
.hero-desc { font-size: 15px; color: rgba(255,255,255,0.75); line-height: 1.6; margin-top: 8px; }
.sdots { display: flex; gap: 5px; margin: 8px 0 4px; }
.sdot { width: 9px; height: 9px; border-radius: 50%; background: var(--s3); }
.sdot.done { background: var(--gold); }
.sdot.cur { background: var(--gold); box-shadow: 0 0 0 3px var(--gdim); }

/* SECTION */
.sec { border-bottom: 1px solid var(--bd); }
.sec-hdr { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; }
.sec-hdr:active { background: var(--s2); }
.sec-hl { display: flex; align-items: center; gap: 9px; }
.sec-title { font-size: 16px; font-weight: 600; }
.sec-cnt { font-size: 12px; color: var(--t3); background: var(--s3); padding: 2px 8px; border-radius: 10px; }
.sec-body { padding: 0 16px 14px; display: none; }
.sec-body.open { display: block; }
.add-btn { display: flex; align-items: center; gap: 6px; padding: 10px 0; font-size: 15px; color: #2c3e6b; background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; }

/* TIMELINE */
.tl-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--bd); }
.tl-item:last-of-type { border-bottom: none; }
.tl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); margin-top: 4px; flex-shrink: 0; }
.tl-date { font-size: 12px; color: var(--t3); margin-bottom: 4px; }
.tl-text { font-size: 15px; color: var(--tx); line-height: 1.55; }
.tl-who { font-size: 13px; color: var(--gold); margin-top: 4px; }
.tl-del { background: var(--s3); border: 1px solid var(--bd); color: var(--t2); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 6px 16px; border-radius: 8px; }

/* PEOPLE CHIPS */
.pchips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.pchip { display: flex; align-items: center; gap: 8px; background: var(--s2); border: 1px solid var(--bd); border-radius: 12px; padding: 9px 12px; cursor: pointer; }
.pchip:active { background: var(--s3); }
.pchip-av { width: 30px; height: 30px; border-radius: 50%; background: var(--gdim); border: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--gold); flex-shrink: 0; }
.pchip-name { font-size: 15px; font-weight: 500; }
.pchip-role { font-size: 12px; color: var(--t2); }

/* ACTION */
.act-item { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bd); align-items: flex-start; }
.act-item:last-of-type { border-bottom: none; }
.acheck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--bd); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.acheck.done { border-color: var(--green); background: var(--green); }
.acheck.done::after { content: '✓'; font-size: 12px; color: #1c2130; font-weight: 700; }
.atitle { font-size: 15px; }
.atitle.done { text-decoration: line-through; color: var(--t3); }
.adue { font-size: 13px; color: var(--t3); margin-top: 3px; }
.adue.over { color: var(--red); }
.xbtn { background: none; border: none; color: var(--t3); cursor: pointer; padding: 4px; display: flex; margin-left: auto; }

/* DOC */
.doc-item { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--bd); align-items: center; }
.doc-item:last-of-type { border-bottom: none; }
.doc-ico { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: rgba(96,160,232,.15); }
.doc-info { flex: 1; overflow: hidden; }
.doc-name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-type { font-size: 12px; color: var(--t3); margin-top: 2px; }
.doc-open { color: var(--blue); font-size: 13px; padding: 6px 12px; background: rgba(96,160,232,.1); border-radius: 7px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
.photo-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-bottom: 10px; }
.photo-thumb { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--s3); cursor: pointer; position: relative; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.65); border: none; color: white; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* STAGE BTNS */
.stage-btns { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; }
.sbtn { padding: 9px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; background: var(--s2); border: 1px solid var(--bd); color: var(--t2); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.sbtn.cur { background: var(--gdim); border-color: var(--gold); color: var(--gold); }

/* PERSON DETAIL */
.phero { padding: 20px 16px; background: var(--s1); border-bottom: 1px solid var(--bd); text-align: center; }
.pav-xl { width: 68px; height: 68px; border-radius: 50%; background: var(--gdim); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: var(--gold); margin: 0 auto 12px; }
.phero-name { font-family: 'DM Serif Display', serif; font-size: 22px; }
.phero-sub { font-size: 14px; color: var(--t2); margin-top: 5px; }
.stars { display: flex; gap: 5px; justify-content: center; margin-top: 9px; }
.star { font-size: 20px; color: var(--t3); cursor: pointer; }
.star.on { color: var(--gold); }
.irow { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--bd); }
.iico { width: 28px; font-size: 16px; text-align: center; flex-shrink: 0; }
.ival { flex: 1; font-size: 15px; }
.icopy { background: none; border: none; color: var(--t3); font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 4px 8px; }

/* BADGES */
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 14px; border: 1px solid; }
.s-발굴{color:#9898e8;border-color:#9898e8;background:rgba(152,152,232,.12)}
.s-검토{color:#60b8f8;border-color:#60b8f8;background:rgba(96,184,248,.12)}
.s-협의{color:#d8b848;border-color:#d8b848;background:rgba(216,184,72,.12)}
.s-구조화{color:#c868e8;border-color:#c868e8;background:rgba(200,104,232,.12)}
.s-실행{color:#40c888;border-color:#40c888;background:rgba(64,200,136,.12)}
.s-클로징{color:var(--gold);border-color:var(--gold);background:var(--gdim)}
.s-완료{color:var(--green);border-color:var(--green);background:rgba(80,192,128,.12)}
.s-중단{color:var(--red);border-color:var(--red);background:rgba(224,104,104,.12)}
.t-MA{color:#70a8f8;border-color:#70a8f8;background:rgba(112,168,248,.12)}
.t-fund{color:var(--gold);border-color:var(--gold);background:var(--gdim)}
.t-re{color:var(--green);border-color:var(--green);background:rgba(80,192,128,.12)}
.t-ipo{color:#c868e8;border-color:#c868e8;background:rgba(200,104,232,.12)}
.t-trade{color:#40d0d8;border-color:#40d0d8;background:rgba(64,208,216,.12)}
.t-ent{color:#e868b0;border-color:#e868b0;background:rgba(232,104,176,.12)}
.t-etc{color:#8098b8;border-color:#8098b8;background:rgba(128,152,184,.12)}

/* MODAL */
#moverlay { position: fixed; inset: 0; background: rgba(0,0,0,.78); z-index: 200; display: none; align-items: flex-end; }
#moverlay.open { display: flex; }
#mbox { background: var(--s1); border-radius: 22px 22px 0 0; width: 100%; padding: 22px 20px calc(22px + var(--SAB)); max-height: 88vh; overflow-y: auto; }
#mbox::-webkit-scrollbar { display: none; }
.mtitle { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 16px; }
.macts { display: flex; gap: 10px; margin-top: 18px; }
.macts .btn { flex: 1; }

/* PHOTO VIEWER */
#photoViewer { position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 300; display: none; align-items: center; justify-content: center; }
#photoViewer.show { display: flex; }
#photoViewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
#pvClose { position: absolute; top: calc(20px + var(--SAT)); right: 20px; background: rgba(255,255,255,.2); border: none; color: white; font-size: 22px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* FORMS */
label { font-size: 12px; color: var(--t2); display: block; margin-bottom: 6px; margin-top: 16px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
label:first-child { margin-top: 0; }
input, textarea, select { background: var(--s2); border: 1px solid var(--bd); border-radius: 11px; color: var(--tx); font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 12px 14px; width: 100%; outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--gold); }
select option { background: var(--s2); }
textarea { resize: none; line-height: 1.6; }
.btn { background: #2c3e6b; color: #ffffff; border: none; border-radius: 11px; padding: 13px 20px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn:active { opacity: .8; }
.btn-g { background: var(--s2); color: var(--t2); border: 1px solid var(--bd); border-radius: 11px; padding: 13px 20px; font-family: 'DM Sans', sans-serif; font-size: 15px; cursor: pointer; }
.delbtn { background: rgba(224,104,104,.1); color: var(--red); border: 1px solid rgba(224,104,104,.25); border-radius: 9px; padding: 9px 16px; font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.sset { padding: 16px; border-bottom: 1px solid var(--bd); }
.stitle { font-size: 12px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; font-weight: 600; }
.syncmsg { font-size: 13px; color: var(--t3); margin-top: 10px; min-height: 20px; }
.empty { text-align: center; padding: 60px 24px; color: var(--t3); }
.empty-icon { font-size: 44px; margin-bottom: 14px; }
.empty p { font-size: 15px; line-height: 1.7; }
</style>
</head>
<body>

<div id="app">
  <!-- UPDATE BANNER -->
  <div id="update-banner" onclick="forceUpdate()">🔄 새 버전 있음 — 탭해서 업데이트</div>

  <!-- TOPBAR -->
  <div class="topbar" id="main-topbar">
    <div class="topbar-inner">
      <h1>My Project</h1>
      <button class="icon-btn" onclick="switchTab('settings')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>

  <!-- CATEGORY BAR (deals only) -->
  <div class="cat-bar" id="cat-bar">
    <div class="cat-tab on" onclick="setCat('important')">⭐ 중요</div>
    <div class="cat-tab" onclick="setCat('normal')">일반</div>
    <div class="cat-tab" onclick="setCat('process')">처리</div>
  </div>
  <div id="process-bar" style="display:none;background:#e8ecf5;border-bottom:1px solid #d0d8ec;flex-shrink:0">
    <div style="display:flex">
      <div class="proc-tab" onclick="setProcCat('hold')" style="flex:1;padding:10px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid #2c3e6b;color:#2c3e6b">보류</div>
      <div class="proc-tab" onclick="setProcCat('drop')" style="flex:1;padding:10px 4px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:#8090b0">폐기</div>
      <div class="proc-tab" onclick="setProcCat('closing')" style="flex:1;padding:10px 4px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:#8090b0">클로징</div>
    </div>
  </div>

  <!-- PAGES -->
  <div id="pages">
    <div class="page active" id="page-deals"></div>
    <div class="page" id="page-todo"></div>
    <div class="page" id="page-people"></div>
    <div class="page" id="page-dash"></div>
    <div class="page" id="page-settings"></div>
  </div>

  <!-- TABBAR -->
  <div id="tabbar">
    <button class="tab-btn on" onclick="switchTab('deals')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>딜
    </button>
    <button class="tab-btn" onclick="switchTab('todo')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>할일
    </button>
    <button class="tab-btn" onclick="switchTab('people')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>고객

<script>
var VER = '9.0';

var TYPES = ['M&A','자금조달','부동산','IPO·상장','무역','엔터테인먼트','기타'];
var ROLES = ['매수인','매도인','투자자','투자대상','FA','법무','회계','주관사','파트너','기타'];
var DTYPES = ['NDA','IM','Term Sheet','계약서','보고서','재무제표','법인등기','리서치','기타'];

var DB = {deals:[], people:[]};

var curDeal = null;
var curPerson = null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ if(!s) return ''; var d=new Date(s+'T12:00:00'); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }
function dLeft(s){ if(!s) return null; return Math.ceil((new Date(s+'T12:00:00')-new Date())/86400000); }
function fmtFee(n){ if(!n||isNaN(n)) return '미정'; n=parseInt(n); if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억'; if(n>=10000) return Math.round(n/10000)+'만'; return n.toLocaleString(); }
function tclass(t){ var m={'M&A':'MA','자금조달':'fund','부동산':'re','IPO·상장':'ipo','무역':'trade','엔터테인먼트':'ent','기타':'etc'}; return 't-'+(m[t]||'etc'); }
function sdotColor(s){ var m={'발굴':'#9898e8','검토':'#60b8f8','협의':'#d8b848','구조화':'#c868e8','실행':'#40c888','클로징':'#d4a84b','완료':'#50c080','중단':'#e06868'}; return m[s]||'#6070a0'; }

function checkAndUpdate(){
  var msg = document.getElementById('update-msg');
  if(msg) msg.textContent = '확인 중...';
  fetch('https://raw.githubusercontent.com/kjsh1028/myproject/main/index.html?_='+Date.now(),{cache:'no-store'})
  .then(function(r){ return r.ok?r.text():null; })
  .then(function(txt){
    if(!txt){ if(msg) msg.textContent = '확인 실패'; return; }
    var m=txt.match(/var VER = '([^']+)'/);
    if(!m){ if(msg) msg.textContent = '확인 실패'; return; }
    if(m[1]===VER){
      if(msg) msg.textContent = '✅ 최신 버전입니다 (v'+VER+')';
    } else {
      var newVer=m[1];
      if(msg){ msg.textContent='🆕 v'+newVer+' 발견! 탭해서 업데이트'; msg.style.cursor='pointer'; msg.style.color='#2c3e6b'; msg.style.fontWeight='600'; }
      if(msg) msg.onclick=function(){
        msg.textContent='업데이트 중...';
        fetch('https://raw.githubusercontent.com/kjsh1028/myproject/main/index.html?_='+Date.now(),{cache:'no-store'})
        .then(function(r){ return r.text(); })
        .then(function(html){
          document.open(); document.write(html); document.close();
        })
        .catch(function(){ msg.textContent='실패 - 새로고침 해주세요'; });
      };
    }
  })
  .catch(function(e){ if(msg) msg.textContent = '오류: '+e.message; });
}
function fmtInput(el){
  var v = el.value.replace(/[^0-9]/g,'');
  if(v) el.value = parseInt(v).toLocaleString();
  else el.value = '';
}

function forceUpdate(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){ r.unregister(); });
      window.location.href = window.location.pathname + '?r=' + Date.now();
    });
  } else {
    window.location.href = window.location.pathname + '?r=' + Date.now();
  }
}
function load(){
  var keys = ['mpdb','mp5_db','mp4_db','mp2_db','myproject_db'];
  var bestDB = null;
  for(var ki=0;ki<keys.length;ki++){
    try{
      var raw=localStorage.getItem(keys[ki]);
      if(raw){
        var parsed=JSON.parse(raw);
        if(parsed&&parsed.deals&&parsed.deals.length){
          if(!bestDB||parsed.deals.length>=bestDB.deals.length) bestDB=parsed;
        }
      }
    }catch(e){}
  }
  if(bestDB) DB=bestDB;
  try{ var s=localStorage.getItem('mp5_set')||localStorage.getItem('mp4_set'); if(s) SETS=JSON.parse(s); }catch(e){}
  if(!DB.deals) DB.deals=[];
  if(!DB.people) DB.people=[];
  DB.deals.forEach(function(d){
    if(!d.category) d.category='important';
    if(!d.timeline) d.timeline=[];
    if(!d.docs) d.docs=[];
    if(!d.research) d.research=[];
    if(!d.actions) d.actions=[];
    if(!d.personIds) d.personIds=[];
  });
  if(DB.deals.length) save();
}

function save(){
  var data = JSON.stringify(DB);
  localStorage.setItem('mpdb', data);
  localStorage.setItem('mp5_db', data);
  // Auto-backup to GitHub if token is set
  autoBackup();
}

var backupTimer = null;
function autoBackup(){
  if(!SETS.tok||!SETS.repo||!SETS.file) return;
  // Debounce - wait 2 seconds after last change before saving
  if(backupTimer) clearTimeout(backupTimer);
  backupTimer = setTimeout(function(){
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(DB,null,2))));
    fetch('https://api.github.com/repos/'+SETS.repo+'/contents/'+SETS.file,{headers:{'Authorization':'token '+SETS.tok}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      var body={message:'auto-save '+new Date().toISOString(),content:content};
      if(j&&j.sha) body.sha=j.sha;
      return fetch('https://api.github.com/repos/'+SETS.repo+'/contents/'+SETS.file,{method:'PUT',headers:{'Authorization':'token '+SETS.tok,'Content-Type':'application/json'},body:JSON.stringify(body)});
    })
    .then(function(r){
      if(r&&r.ok){
        var el=document.getElementById('autosave-status');
        if(el){ el.textContent='✅ 자동저장 '+new Date().toLocaleTimeString(); el.style.display='block'; setTimeout(function(){ el.style.display='none'; },3000); }
      }
    })
    .catch(function(){});
  }, 2000);
}

/* TABS */
function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('on'); });
  var pg=document.getElementById('page-'+tab);
  if(pg) pg.classList.add('active');
  var btns=document.querySelectorAll('.tab-btn');
  var tabIdx={'deals':0,'todo':1,'people':2,'dash':3};
  if(tabIdx[tab]!==undefined) btns[tabIdx[tab]].classList.add('on');
  document.getElementById('cat-bar').style.display=(tab==='deals'?'flex':'none');
  document.getElementById('fab').style.display=(tab==='deals'||tab==='people'?'flex':'none');
  if(tab==='deals') renderDeals();
  else if(tab==='todo') renderTodo();
  else if(tab==='people') renderPeople();
  else if(tab==='dash') renderDash();
  else if(tab==='settings') renderSettings();
}

var curProcCat = 'hold';
function setCat(cat){
  curCat=cat;
  document.querySelectorAll('.cat-tab').forEach(function(el,i){ el.classList.toggle('on',['important','normal','process'][i]===cat); });
  var pb=document.getElementById('process-bar');
  if(pb) pb.style.display=(cat==='process'?'block':'none');
  renderDeals();
}
function setProcCat(cat){
  curProcCat=cat;
  document.querySelectorAll('.proc-tab').forEach(function(el,i){
    var cats=['hold','drop','closing'];
    el.style.borderBottomColor=(cats[i]===cat?'#2c3e6b':'transparent');
    el.style.color=(cats[i]===cat?'#2c3e6b':'#8090b0');
  });
  renderDeals();
}

/* RENDER DEALS */
function renderDeals(){
  var filterCat = curCat==='process' ? curProcCat : curCat;
  var deals=DB.deals.filter(function(d){ return (d.category||'important')===filterCat; });
  deals.sort(function(a,b){ var si=function(d){ return STAGES.indexOf(d.stage); }; if(si(a)!==si(b)) return si(a)-si(b); return (b.updatedAt||'')>(a.updatedAt||'')?1:-1; });
  var _ico=filterCat==='important'?'⭐':filterCat==='normal'?'📋':filterCat==='hold'?'⏸':filterCat==='closing'?'✅':'🗑';
  if(!deals.length){
    document.getElementById('page-deals').innerHTML='<div class="empty"><div class="empty-icon">'+_ico+'</div><p>딜이 없습니다<br>+ 버튼으로 추가하세요</p></div>';
    return;
  }
  var html='<div style="padding:10px 14px;display:flex;flex-direction:column;gap:10px">';
  for(var i=0;i<deals.length;i++){
    var d=deals[i];
    var ppl=(d.personIds||[]).slice(0,2).map(function(pid){ return DB.people.find(function(p){ return p.id===pid; }); }).filter(Boolean);
    var pplNames=ppl.map(function(p){ return p.name; }).join(' · ');
    var nextAct=(d.actions||[]).find(function(a){ return !a.done; });
    var stageColor=sdotColor(d.stage);
    var feeStr=d.fee&&parseInt(d.fee)?fmtFee(parseInt(d.fee),d.currency||'KRW'):'';

    html+='<div onclick="openDeal(\''+d.id+'\')" style="background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 6px rgba(44,62,107,0.10);border:1px solid #e8ecf5;cursor:pointer;">';

    // Top row: name + fee
    html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px">';
    html+='<div style="font-size:18px;font-weight:700;color:#1a2340;line-height:1.3;flex:1">'+d.name+'</div>';
    if(feeStr) html+='<div style="font-size:16px;font-weight:700;color:#b8860b;flex-shrink:0">'+feeStr+'</div>';
    html+='</div>';

    // Sub info row
    var subParts=[];
    if(d.type) subParts.push(d.type);
    if(pplNames) subParts.push(pplNames);
    if(d.country) subParts.push('📍'+d.country);
    if(subParts.length){
      html+='<div style="font-size:13px;color:#6070a0;margin-bottom:8px">'+subParts.join(' · ')+'</div>';
    }

    // Next action only (no stage badge)
    if(nextAct) html+='<div style="font-size:13px;color:#6070a0;margin-top:4px">→ '+nextAct.title+'</div>';

    html+='</div>';
  }
  html+='</div>';
  document.getElementById('page-deals').innerHTML=html;
}

function renderTodo(){
  try{
  var all=[];
  DB.deals.forEach(function(d){
    (d.actions||[]).forEach(function(a,ai){ all.push({a:a,i:ai,dealName:d.name,dealId:d.id}); });
  });
  var und=(todoStatus==='undone');
  var AC='#2c3e6b';
  var html='';

  // Status toggle
  html+='<div style="display:flex;border-bottom:1px solid var(--bd)">';
  html+='<div onclick="setTodoStatus(\'undone\')" style="flex:1;padding:11px 0;text-align:center;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid '+(und?AC:'transparent')+';color:'+(und?AC:'#8090b0')+'">\uBBF8\uC644\uB8CC</div>';
  html+='<div onclick="setTodoStatus(\'done\')" style="flex:1;padding:11px 0;text-align:center;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid '+(und?'transparent':AC)+';color:'+(und?'#8090b0':AC)+'">\uC644\uB8CC</div>';
  html+='</div>';

  // Project filter - compact: 전체 + 선택 button
  var selDeal = todoFilter!=='all' ? DB.deals.find(function(d){ return d.id===todoFilter; }) : null;
  html+='<div style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--bd)">';
  html+='<div onclick="setTodoFilter(\'all\')" style="padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;background:'+(todoFilter==='all'?AC:'var(--s2)')+';color:'+(todoFilter==='all'?'#fff':'var(--t2)')+';border:1px solid '+(todoFilter==='all'?AC:'var(--bd)')+'">전체</div>';
  html+='<div onclick="openTodoProjectPicker()" style="flex:1;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;background:var(--s2);color:'+(selDeal?AC:'var(--t3)')+';border:1px solid '+(selDeal?AC:'var(--bd)')+';">'+(selDeal?selDeal.name:'프로젝트 선택...')+' ▾</div>';
  html+='</div>';

  // Filter data
  var filtered=(todoFilter==='all')?all:all.filter(function(x){ return x.dealId===todoFilter; });
  var showing=und?filtered.filter(function(x){ return !x.done; }):filtered.filter(function(x){ return x.done; });

  if(!showing.length){
    html+='<div class="empty"><div class="empty-icon">'+(und?'📋':'✅')+'</div><p>'+(und?'할일이 없습니다':'완료된 항목이 없습니다')+'</p></div>';
    document.getElementById('page-todo').innerHTML=html; return;
  }

  if(und){
    showing.sort(function(a,b){ return (a.a.due||'9')>(b.a.due||'9')?1:-1; });
    var over=showing.filter(function(x){ var dl=dLeft(x.a.due); return dl!==null&&dl<0; });
    var tod=showing.filter(function(x){ return dLeft(x.a.due)===0; });
    var up=showing.filter(function(x){ var dl=dLeft(x.a.due); return dl===null||dl>0; });
    [{t:'⚠️ 기한 초과',items:over},{t:'📅 오늘',items:tod},{t:'📋 예정',items:up}].forEach(function(sec){
      if(!sec.items.length) return;
      html+='<div class="todo-sec-title">'+sec.t+'</div>';
      sec.items.forEach(function(item){
        var dl=dLeft(item.a.due);
        var dTxt=dl===null?'':dl===0?'오늘':dl<0?Math.abs(dl)+'일 초과':'D-'+dl;
        var dCol=dl<0?'var(--red)':dl===0?'var(--gold)':'var(--t3)';
        html+='<div class="todo-row" onclick="openTodoItemEdit(\''+item.dealId+'\','+item.i+')">';
        html+='<div class="acheck" onclick="event.stopPropagation();togActById(\''+item.dealId+'\','+item.i+')"></div>';
        html+='<div style="flex:1"><div style="font-size:15px">'+item.a.title+'</div>';
        html+='<div style="font-size:13px;color:var(--t2);margin-top:2px">'+item.dealName+(dTxt?' · <span style="color:'+dCol+'">'+dTxt+'</span>':'')+'</div></div>';
        html+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3);flex-shrink:0"><path d="M9 18l6-6-6-6"/></svg></div>';
      });
    });
  } else {
    showing.sort(function(a,b){ return (b.a.doneAt||'')>(a.a.doneAt||'')?1:-1; });
    html+='<div class="todo-sec-title">완료 ('+showing.length+'개)</div>';
    showing.forEach(function(item){
      html+='<div class="todo-row" onclick="openTodoItemEdit(\''+item.dealId+'\','+item.i+')">';
      html+='<div class="acheck done" onclick="event.stopPropagation();togActById(\''+item.dealId+'\','+item.i+')"></div>';
      html+='<div style="flex:1"><div style="font-size:15px;text-decoration:line-through;color:var(--t3)">'+item.a.title+'</div>';
      html+='<div style="font-size:13px;color:var(--t3);margin-top:2px">'+item.dealName+(item.a.doneAt?' · 완료 '+fmtDate(item.a.doneAt):'')+'</div></div>';
      html+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3);flex-shrink:0"><path d="M9 18l6-6-6-6"/></svg></div>';
    });
  }
  document.getElementById('page-todo').innerHTML=html;
  } catch(e){ document.getElementById('page-todo').innerHTML='<div class="empty"><p>오류: '+e.message+'</p></div>'; }
}

function renderDash(){
  var active=DB.deals.filter(function(d){ return d.category==='important'||d.category==='normal'; });
  var closingDeals=DB.deals.filter(function(d){ return d.category==='closing'; });
  var activeFee=active.reduce(function(a,d){ return a+(parseInt(d.fee)||0); },0);
  var closingFee=closingDeals.reduce(function(a,d){ return a+(parseInt(d.fee)||0); },0);
  var html='';

  // Pipeline
  html+='<div style="background:#2c3e6b;padding:20px 16px 16px">';
  html+='<div style="font-size:12px;color:rgba(255,255,255,0.6);letter-spacing:.07em;margin-bottom:12px">파이프라인</div>';
  html+='<div style="display:flex;gap:12px">';
  html+='<div style="flex:1;background:rgba(255,255,255,0.1);border-radius:12px;padding:14px">';
  html+='<div style="font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:6px">진행 중</div>';
  html+='<div style="font-size:26px;font-weight:700;color:#fff">'+active.length+'<span style="font-size:14px;font-weight:400"> 건</span></div>';
  html+='<div style="font-size:14px;color:#e8c96e;margin-top:4px">'+fmtFee(activeFee,'KRW')+'</div>';
  html+='</div>';
  html+='<div style="flex:1;background:rgba(255,255,255,0.1);border-radius:12px;padding:14px">';
  html+='<div style="font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:6px">클로징</div>';
  html+='<div style="font-size:26px;font-weight:700;color:#fff">'+closingDeals.length+'<span style="font-size:14px;font-weight:400"> 건</span></div>';
  html+='<div style="font-size:14px;color:#6dcf9e;margin-top:4px">'+(closingFee?fmtFee(closingFee,'KRW'):'—')+'</div>';
  html+='</div></div></div>';

  // Neglected deals
  var neglected=active.filter(function(d){
    if(!d.updatedAt) return true;
    return Math.floor((new Date()-new Date(d.updatedAt))/86400000)>=30;
  });
  if(neglected.length){
    html+='<div style="padding:14px 16px;border-bottom:1px solid var(--bd)">';
    html+='<div style="font-size:12px;color:var(--red);letter-spacing:.07em;font-weight:600;margin-bottom:10px">⚠️ 장기 방치 딜 (30일+)</div>';
    for(var i=0;i<neglected.length;i++){
      var d=neglected[i];
      var days=d.updatedAt?Math.floor((new Date()-new Date(d.updatedAt))/86400000):99;
      var did=d.id;
      html+='<div class="person-row" onclick="openDealFromDash(\''+did+'\')" style="padding:10px 0;border-bottom:'+(i<neglected.length-1?'1px solid var(--bd)':'none')+'">';
      html+='<div style="width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:4px"></div>';
      html+='<div style="flex:1"><div style="font-size:15px;font-weight:500">'+d.name+'</div>';
      html+='<div style="font-size:13px;color:var(--red);margin-top:2px">'+days+'일째 업데이트 없음</div></div>';
      html+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3)"><path d="M9 18l6-6-6-6"/></svg></div>';
    }
    html+='</div>';
  }

  // Urgent actions D-7
  var urgent=[];
  DB.deals.forEach(function(d){
    (d.actions||[]).forEach(function(a,ai){
      if(a.done) return;
      var dl=dLeft(a.due);
      if(dl!==null&&dl<=7) urgent.push({a:a,ai:ai,dealName:d.name,dealId:d.id,dl:dl});
    });
  });
  urgent.sort(function(a,b){ return a.dl-b.dl; });
  if(urgent.length){
    html+='<div style="padding:14px 16px;border-bottom:1px solid var(--bd)">';
    html+='<div style="font-size:12px;color:var(--t3);letter-spacing:.07em;font-weight:600;margin-bottom:10px">📅 기한 임박 (D-7)</div>';
    for(var i=0;i<urgent.length;i++){
      var item=urgent[i]; var dl=item.dl;
      var dc=dl<0?'var(--red)':dl===0?'#b8860b':'var(--t3)';
      var dt=dl<0?Math.abs(dl)+'일 초과':dl===0?'오늘':'D-'+dl;
      var did2=item.dealId;
      html+='<div class="person-row" onclick="openDealFromDash(\''+did2+'\')" style="padding:10px 0;border-bottom:'+(i<urgent.length-1?'1px solid var(--bd)':'none')+'">';
      html+='<div style="width:8px;height:8px;border-radius:50%;background:'+dc+';flex-shrink:0;margin-top:4px"></div>';
      html+='<div style="flex:1"><div style="font-size:15px">'+item.a.title+'</div>';
      html+='<div style="font-size:13px;color:var(--t2);margin-top:2px">'+item.dealName+'</div></div>';
      html+='<div style="font-size:12px;font-weight:600;color:'+dc+'">'+dt+'</div></div>';
    }
    html+='</div>';
  }

  // Recent logs
  var logs=[];
  DB.deals.forEach(function(d){
    (d.timeline||[]).forEach(function(l){
      logs.push({l:l,dealName:d.name,dealId:d.id});
    });
  });
  logs.sort(function(a,b){ return (b.l.date||'')>(a.l.date||'')?1:-1; });
  logs=logs.slice(0,5);
  if(logs.length){
    html+='<div style="padding:14px 16px">';
    html+='<div style="font-size:12px;color:var(--t3);letter-spacing:.07em;font-weight:600;margin-bottom:10px">🕐 최근 활동</div>';
    for(var i=0;i<logs.length;i++){
      var item=logs[i]; var did3=item.dealId;
      html+='<div class="person-row" onclick="openDealFromDash(\''+did3+'\')" style="padding:10px 0;border-bottom:'+(i<logs.length-1?'1px solid var(--bd)':'none')+'">';
      html+='<div class="tl-dot" style="margin-top:4px;flex-shrink:0"></div>';
      html+='<div style="flex:1"><div style="font-size:14px">'+item.l.content.slice(0,40)+(item.l.content.length>40?'...':'')+'</div>';
      html+='<div style="font-size:12px;color:var(--t3);margin-top:2px">'+item.dealName+' · '+fmtDate(item.l.date)+'</div></div></div>';
    }
    html+='</div>';
  }

  if(!active.length&&!closingDeals.length) html+='<div class="empty"><div class="empty-icon">📊</div><p>딜을 추가하면<br>대시보드가 채워집니다</p></div>';
  document.getElementById('page-dash').innerHTML=html;
}

function silentPull(){
  if(!SETS.tok||!SETS.repo||!SETS.file) return;
  fetch('https://api.github.com/repos/'+SETS.repo+'/contents/'+SETS.file,{headers:{'Authorization':'token '+SETS.tok},cache:'no-store'})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    if(!j) return;
    try{
      var raw=decodeURIComponent(escape(atob(j.content.split('\n').join(''))));
      var ghData=JSON.parse(raw);
      if(!ghData.deals) ghData.deals=[];
      if(!ghData.people) ghData.people=[];
      if(ghData.deals.length>=DB.deals.length){
        DB=ghData;
        DB.deals.forEach(function(d){
          if(!d.category) d.category='important';
          if(!d.timeline) d.timeline=[];
          if(!d.docs) d.docs=[];
          if(!d.research) d.research=[];
          if(!d.actions) d.actions=[];
          if(!d.personIds) d.personIds=[];
        });
        save();
        renderDeals();
      }
    }catch(e){}
  })
  .catch(function(){});
}

function pushGH(){
  var tok=document.getElementById('s-tok').value.trim();
  var repo=document.getElementById('s-repo').value.trim();
  var file=document.getElementById('s-file').value.trim();
  SETS.tok=tok; SETS.repo=repo; SETS.file=file;
  localStorage.setItem('mp5_set',JSON.stringify(SETS));
  if(!tok||!repo||!file){ setSM('❌ 토큰, repo, 파일명 입력하세요'); return; }
  setSM('저장 중...');
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(DB,null,2))));
  fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{headers:{'Authorization':'token '+tok}})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){ var body={message:'update '+new Date().toISOString(),content:content}; if(j&&j.sha) body.sha=j.sha; return fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{method:'PUT',headers:{'Authorization':'token '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)}); })
  .then(function(r){ setSM(r.ok?'✅ 저장 완료 '+new Date().toLocaleTimeString():'❌ 실패 '+r.status); })
  .catch(function(e){ setSM('❌ '+e.message); });
}
function pullGH(){
  var tok=document.getElementById('s-tok').value.trim();
  var repo=document.getElementById('s-repo').value.trim();
  var file=document.getElementById('s-file').value.trim();
  SETS.tok=tok; SETS.repo=repo; SETS.file=file;
  localStorage.setItem('mp5_set',JSON.stringify(SETS));
  if(!tok||!repo||!file){ setSM('❌ 설정을 입력하세요'); return; }
  setSM('불러오는 중...');
  fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{headers:{'Authorization':'token '+tok}})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){ if(!j){ setSM('❌ 실패'); return; } var data=JSON.parse(decodeURIComponent(escape(atob(j.content)))); DB=data; if(!DB.deals) DB.deals=[]; if(!DB.people) DB.people=[]; DB.deals.forEach(function(d){ if(!d.category) d.category='important'; if(!d.timeline) d.timeline=[]; if(!d.docs) d.docs=[]; if(!d.research) d.research=[]; if(!d.actions) d.actions=[]; if(!d.personIds) d.personIds=[]; }); save(); switchTab(curTab); setSM('✅ 불러오기 완료'); })
  .catch(function(e){ setSM('❌ '+e.message); });
}
function setSM(m){ var el=document.getElementById('syncmsg'); if(el) el.textContent=m; }
function exportData(){ var b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='myproject.json'; a.click(); }
function showStorageInfo(){
  var el = document.getElementById('storage-info');
  if(!el) return;
  var info = 'localStorage 키: ';
  var found = false;
  var keys = ['mp5_db','mp4_db','mp2_db','myproject_db','mp5_set','mp4_set'];
  for(var i=0;i<keys.length;i++){
    var v = localStorage.getItem(keys[i]);
    if(v){
      found = true;
      try{
        var parsed = JSON.parse(v);
        if(parsed.deals !== undefined){
          info += ' | '+keys[i]+': 딜 '+(parsed.deals||[]).length+'개 관련자 '+(parsed.people||[]).length+'명';
        } else {
          info += ' | '+keys[i]+': 설정';
        }
      } catch(e){
        info += ' | '+keys[i]+'...';
      }
    }
  }
  if(!found) info += '(저장된 데이터 없음)';
  el.textContent = info;
  // Also try to find and use any data found
  var bestDB = null;
  var dataKeys = ['mp5_db','mp4_db','mp2_db','myproject_db'];
  for(var i=0;i<dataKeys.length;i++){
    try{
      var raw = localStorage.getItem(dataKeys[i]);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed.deals && parsed.deals.length){
          if(!bestDB || parsed.deals.length > bestDB.deals.length){
            bestDB = parsed;
          }
        }
      }
    }catch(e){}
  }
  if(bestDB && bestDB.deals.length > 0){
    DB = bestDB;
    save();
    switchTab(curTab);
    el.textContent += ' >> 복구완료! 딜 '+DB.deals.length+'개';
  }
}

function savePerson(isEdit){ var el=document.getElementById('fpn'); var name=el?el.value.trim():''; if(!name||name==='홍길동'){ alert('이름을 입력하세요'); return; } var data={name:name,org:document.getElementById('fpo').value,title:document.getElementById('fpt').value,role:document.getElementById('fpr').value,phone:document.getElementById('fpph').value,email:document.getElementById('fpe').value,wechat:document.getElementById('fpw').value,country:document.getElementById('fpco').value,lang:document.getElementById('fpl').value,rating:parseInt(document.getElementById('fprat').value)||0,memo:document.getElementById('fpm').value}; if(isEdit){ var p=DB.people.find(function(x){ return x.id===curPerson; }); if(p) Object.assign(p,data); } else { var np={id:uid(),logs:[],createdAt:today()}; Object.assign(np,data); DB.people.push(np); } save(); closeModal(); if(isEdit) renderPersonDetail(); renderPeople(); }

function openLinkPerson(){ var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; var avail=DB.people.filter(function(p){ return (d.personIds||[]).indexOf(p.id)<0; }); var h=''; if(avail.length){ for(var i=0;i<avail.length;i++){ var p=avail[i]; h+='<div class="pchip" onclick="linkP(\''+p.id+'\')" style="width:100%;margin-bottom:10px"><div class="pchip-av">'+p.name.slice(-1)+'</div><div><div class="pchip-name">'+p.name+'</div><div class="pchip-role">'+(p.org||'')+(p.title?' · '+p.title:'')+'</div></div></div>'; } } else h='<p style="font-size:15px;color:var(--t2);margin-bottom:14px">추가된 관련자가 없습니다</p>'; h+='<button class="add-btn" onclick="closeModal();setTimeout(openAddAndLink,80)">+ 새 관련자 추가</button>'; showModal('관련자 연결',h,[{label:'닫기',fn:'closeModal()',g:true}]); }
function linkP(pid){ var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; if(!d.personIds) d.personIds=[]; if(d.personIds.indexOf(pid)<0){ d.personIds.push(pid); d.updatedAt=today(); save(); } closeModal(); renderDetail(); }

/* UPDATE CHECK */
function showUpdateBanner(){
  var b=document.getElementById('update-banner');
  if(b){ b.style.display='block'; b.textContent='🔄 새 버전 있음 — 탭해서 업데이트'; }
}
function checkUpdate(){
  fetch('https://api.github.com/repos/kjsh1028/myproject/contents/index.html',{cache:'no-store'})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    if(!j) return;
    var raw=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
    var m=raw.match(/var VER = '([^']+)'/);
    if(m&&m[1]!==VER){ showUpdateBanner(); }
  }).catch(function(){});
}

// Swipe back gesture for detail pages
function addSwipeBack(el, closeFn){
  var sx=0, sy=0, swiping=false;
  el.addEventListener('touchstart', function(e){
    sx=e.touches[0].clientX;
    sy=e.touches[0].clientY;
    swiping = sx < 80;
  }, {passive:true});
  el.addEventListener('touchmove', function(e){
    if(!swiping) return;
    var dx=e.touches[0].clientX-sx;
    var dy=Math.abs(e.touches[0].clientY-sy);
    if(dy>40){ swiping=false; return; }
    if(dx>0) el.style.transform='translateX('+dx+'px)';
  }, {passive:true});
  el.addEventListener('touchend', function(e){
    if(!swiping) return;
    var dx=e.changedTouches[0].clientX-sx;
    el.style.transform='';
    if(dx>60) closeFn();
    swiping=false;
  }, {passive:true});
}
addSwipeBack(document.getElementById('detail-page'), closeDetail);
addSwipeBack(document.getElementById('person-page'), closePerson);
// Register service worker for no-cache updates
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.addEventListener('updatefound', function(){
      var newSW = reg.installing;
      newSW.addEventListener('statechange', function(){
        if(newSW.state==='installed' && navigator.serviceWorker.controller){
          showUpdateBanner();
        }
      });
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange', function(){ window.location.reload(); });
}
setTimeout(checkUpdate,3000);
