<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Project</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1f2e;
  --s1: #222838;
  --s2: #2a3245;
  --s3: #323d52;
  --bd: #3a4560;
  --bd2: #445070;
  --gold: #d4a84b;
  --gold2: #e8c278;
  --gdim: rgba(212,168,75,0.13);
  --tx: #eef0f5;
  --t2: #a0aabf;
  --t3: #606880;
  --red: #e06060;
  --green: #50c080;
  --blue: #5090e0;
  --SAT: env(safe-area-inset-top,0px);
  --SAB: env(safe-area-inset-bottom,0px);
  --TABH: 60px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--tx); font-family: 'DM Sans', sans-serif; overflow: hidden; }

/* ── STACK ── */
#stack { position: relative; width: 100%; height: 100dvh; overflow: hidden; }
.layer { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); }
.layer.base { transform: translateX(0); }
.layer.active { transform: translateX(0); }
.layer.behind { transform: translateX(-26%); }

/* ── TOPBAR ── */
.topbar { flex-shrink: 0; padding-top: var(--SAT); background: var(--s1); border-bottom: 1px solid var(--bd); }
.topbar-inner { height: 50px; display: flex; align-items: center; padding: 0 12px 0 8px; gap: 4px; }
.topbar h1 { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--gold); flex: 1; padding-left: 6px; letter-spacing: .01em; }
.topbar h2 { font-size: 15px; font-weight: 600; flex: 1; padding-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tx); }
.back-btn, .icon-btn { width: 38px; height: 38px; border-radius: 9px; background: none; border: none; color: var(--t2); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.back-btn:active, .icon-btn:active { background: var(--s3); }

/* ── TABBAR ── */
#tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: calc(var(--TABH) + var(--SAB)); padding-bottom: var(--SAB); background: var(--s1); border-top: 1px solid var(--bd); display: flex; z-index: 50; flex-shrink: 0; }
.tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: none; color: var(--t3); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 500; transition: color .18s; }
.tab-btn svg { width: 22px; height: 22px; }
.tab-btn.on { color: var(--gold); }

/* ── LAYER BODY ── */
.lbody { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--TABH) + var(--SAB) + 8px); }
.lbody::-webkit-scrollbar { display: none; }
.lbody-notab { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 20px; }
.lbody-notab::-webkit-scrollbar { display: none; }

/* ── FAB ── */
.fab { position: absolute; bottom: calc(var(--TABH) + var(--SAB) + 16px); right: 18px; width: 50px; height: 50px; border-radius: 50%; background: var(--gold); color: #1a1f2e; border: none; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(212,168,75,.35); z-index: 51; transition: transform .15s; font-weight: 400; }
.fab:active { transform: scale(.91); }

/* ── HOME PAGE ── */
.home-header { padding: 14px 16px 10px; background: var(--s1); border-bottom: 1px solid var(--bd); }
.home-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.home-title { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--gold); }
.stats-row { display: flex; gap: 8px; }
.stat-pill { flex: 1; background: var(--s2); border: 1px solid var(--bd); border-radius: 10px; padding: 8px 6px; text-align: center; }
.stat-n { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--tx); line-height: 1; }
.stat-l { font-size: 10px; color: var(--t3); margin-top: 2px; text-transform: uppercase; letter-spacing: .05em; }

/* ── DEAL CARD ── */
.deal-card { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--bd); cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: 12px; }
.deal-card:active { background: var(--s2); }
.deal-card-left { flex: 1; min-width: 0; }
.deal-card-name { font-size: 15px; font-weight: 600; color: var(--tx); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deal-card-row2 { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; flex-wrap: wrap; }
.deal-card-action { font-size: 11px; color: var(--t2); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.deal-card-action::before { content: '→'; color: var(--gold); font-size: 11px; }
.deal-card-right { text-align: right; flex-shrink: 0; }
.deal-fee { font-size: 13px; color: var(--gold); font-weight: 600; white-space: nowrap; }
.deal-stage-pill { font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid; display: inline-block; margin-top: 4px; }
.pip-row { display: flex; gap: 2px; margin-top: 5px; }
.pip { height: 3px; border-radius: 2px; flex: 1; background: var(--s3); }

/* ── PEOPLE LIST ── */
.person-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--bd); cursor: pointer; }
.person-row:active { background: var(--s2); }
.pav { width: 38px; height: 38px; border-radius: 50%; background: var(--gdim); border: 1.5px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--gold); flex-shrink: 0; }
.prow-info { flex: 1; }
.prow-name { font-size: 14px; font-weight: 600; color: var(--tx); }
.prow-sub { font-size: 12px; color: var(--t2); margin-top: 2px; }
.prow-deals { font-size: 11px; color: var(--gold); margin-top: 2px; }

/* ── DASHBOARD ── */
.dash-section { padding: 14px 16px 6px; }
.dash-section-title { font-size: 11px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin-bottom: 10px; }
.dash-deal-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--bd); cursor: pointer; }
.dash-deal-row:active { background: var(--s2); }
.stage-bar-wrap { padding: 0 16px 14px; }
.sbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.sbar-label { font-size: 12px; color: var(--t2); width: 44px; flex-shrink: 0; }
.sbar-track { flex: 1; background: var(--s3); border-radius: 3px; height: 5px; }
.sbar-fill { height: 100%; border-radius: 3px; background: var(--gold); }
.sbar-n { font-size: 11px; color: var(--t3); width: 14px; text-align: right; flex-shrink: 0; }
.action-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--bd); }
.acheck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--bd2); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 1px; transition: all .18s; }
.acheck.done { border-color: var(--green); background: var(--green); }
.acheck.done::after { content: '✓'; font-size: 11px; color: #1a1f2e; font-weight: 700; }
.atxt { flex: 1; }
.atitle { font-size: 13px; color: var(--tx); }
.atitle.done { text-decoration: line-through; color: var(--t3); }
.adue { font-size: 11px; color: var(--t3); margin-top: 2px; }
.adue.over { color: var(--red); }

/* ── BADGES ── */
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 12px; border: 1px solid; }
.s-발굴 { color: #9090e0; border-color: #9090e0; background: rgba(144,144,224,.12); }
.s-검토 { color: #60b0f0; border-color: #60b0f0; background: rgba(96,176,240,.12); }
.s-협의 { color: #d4b040; border-color: #d4b040; background: rgba(212,176,64,.12); }
.s-구조화 { color: #c060e0; border-color: #c060e0; background: rgba(192,96,224,.12); }
.s-실행 { color: #40c080; border-color: #40c080; background: rgba(64,192,128,.12); }
.s-클로징 { color: var(--gold); border-color: var(--gold); background: var(--gdim); }
.s-완료 { color: #50c080; border-color: #50c080; background: rgba(80,192,128,.12); }
.s-중단 { color: var(--red); border-color: var(--red); background: rgba(224,96,96,.12); }
.t-MA { color: #70a0f0; border-color: #70a0f0; background: rgba(112,160,240,.12); }
.t-fund { color: var(--gold); border-color: var(--gold); background: var(--gdim); }
.t-re { color: #50c080; border-color: #50c080; background: rgba(80,192,128,.12); }
.t-ipo { color: #c060e0; border-color: #c060e0; background: rgba(192,96,224,.12); }
.t-trade { color: #40c8d0; border-color: #40c8d0; background: rgba(64,200,208,.12); }
.t-ent { color: #e060a0; border-color: #e060a0; background: rgba(224,96,160,.12); }
.t-etc { color: #8090a8; border-color: #8090a8; background: rgba(128,144,168,.12); }

/* ── DEAL DETAIL ── */
.hero { padding: 14px 16px; background: var(--s1); border-bottom: 1px solid var(--bd); }
.hero-name { font-family: 'DM Serif Display', serif; font-size: 21px; color: var(--tx); margin-bottom: 8px; line-height: 1.25; }
.hero-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.hero-fee { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--gold); margin-top: 4px; }
.sdots { display: flex; gap: 4px; margin-bottom: 4px; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--s3); }
.sdot.done { background: var(--gold); }
.sdot.cur { background: var(--gold); box-shadow: 0 0 0 3px var(--gdim); }
.sec { border-bottom: 1px solid var(--bd); }
.sec-hdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; }
.sec-hdr:active { background: var(--s2); }
.sec-hdr-l { display: flex; align-items: center; gap: 8px; }
.sec-title { font-size: 13px; font-weight: 600; color: var(--tx); }
.sec-cnt { font-size: 11px; color: var(--t3); background: var(--s3); padding: 1px 7px; border-radius: 10px; }
.sec-body { padding: 0 16px 12px; display: none; }
.sec-body.open { display: block; }
.add-btn { display: flex; align-items: center; gap: 5px; padding: 8px 0; font-size: 13px; color: var(--gold); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; }
.pchips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.pchip { display: flex; align-items: center; gap: 7px; background: var(--s2); border: 1px solid var(--bd); border-radius: 10px; padding: 6px 10px; cursor: pointer; }
.pchip:active { border-color: var(--gold); }
.pchip-av { width: 26px; height: 26px; border-radius: 50%; background: var(--gdim); border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--gold); flex-shrink: 0; }
.pchip-name { font-size: 13px; font-weight: 500; }
.pchip-role { font-size: 11px; color: var(--t2); }
.act-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--bd); }
.act-item:last-of-type { border-bottom: none; }
.xbtn { background: none; border: none; color: var(--t3); cursor: pointer; padding: 4px; display: flex; }
.log-item { padding: 9px 0; border-bottom: 1px solid var(--bd); }
.log-item:last-of-type { border-bottom: none; }
.log-date { font-size: 11px; color: var(--t3); margin-bottom: 2px; }
.log-txt { font-size: 13px; color: var(--tx); line-height: 1.55; }
.log-who { font-size: 11px; color: var(--gold); margin-top: 2px; }
.ditem { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--bd); }
.ditem:last-of-type { border-bottom: none; }
.dico { width: 30px; height: 30px; border-radius: 7px; background: rgba(80,144,224,.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.dinfo { flex: 1; overflow: hidden; }
.dname { font-size: 13px; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dtype { font-size: 11px; color: var(--t3); margin-top: 1px; }
.dopen { color: var(--blue); font-size: 12px; padding: 4px 10px; background: rgba(80,144,224,.1); border-radius: 6px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
.stage-btns { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; }
.sbtn { padding: 6px 13px; border-radius: 18px; font-size: 12px; font-weight: 500; background: var(--s2); border: 1px solid var(--bd); color: var(--t2); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.sbtn.cur { background: var(--gdim); border-color: var(--gold); color: var(--gold); }

/* ── PERSON DETAIL ── */
.phero { padding: 18px 16px; background: var(--s1); border-bottom: 1px solid var(--bd); text-align: center; }
.pav-big { width: 60px; height: 60px; border-radius: 50%; background: var(--gdim); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: var(--gold); margin: 0 auto 10px; }
.phero-name { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--tx); }
.phero-sub { font-size: 13px; color: var(--t2); margin-top: 3px; }
.stars { display: flex; gap: 4px; justify-content: center; margin-top: 7px; }
.star { font-size: 17px; color: var(--t3); cursor: pointer; }
.star.on { color: var(--gold); }
.irow { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--bd); }
.iico { width: 26px; font-size: 14px; text-align: center; flex-shrink: 0; color: var(--t2); }
.ival { flex: 1; font-size: 14px; color: var(--tx); }
.icopy { background: none; border: none; color: var(--t3); font-size: 11px; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 4px 8px; }
.imemo { padding: 11px 16px; font-size: 13px; color: var(--t2); line-height: 1.65; border-bottom: 1px solid var(--bd); }
.dlrow { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--bd); cursor: pointer; }
.dlrow:active { background: var(--s2); }
.deal-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* ── SWIPE HINT ── */
.swipe-hint { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--t3); padding: 5px 16px; border-bottom: 1px solid var(--bd); flex-shrink: 0; }

/* ── MODAL ── */
#moverlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 900; display: none; align-items: flex-end; }
#moverlay.open { display: flex; }
#mbox { background: var(--s1); border-radius: 20px 20px 0 0; width: 100%; padding: 20px 20px calc(20px + var(--SAB)); max-height: 88vh; overflow-y: auto; }
#mbox::-webkit-scrollbar { display: none; }
.mtitle { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--tx); margin-bottom: 14px; }
.macts { display: flex; gap: 10px; margin-top: 16px; }
.macts .btn { flex: 1; }

/* ── FORMS ── */
label { font-size: 11px; color: var(--t2); display: block; margin-bottom: 5px; margin-top: 14px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
label:first-child { margin-top: 0; }
input, textarea, select { background: var(--s2); border: 1px solid var(--bd2); border-radius: 10px; color: var(--tx); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 11px 13px; width: 100%; outline: none; transition: border-color .18s; }
input:focus, textarea:focus, select:focus { border-color: var(--gold); }
select option { background: var(--s2); }
textarea { resize: none; line-height: 1.55; }
.btn { background: var(--gold); color: #1a1f2e; border: none; border-radius: 10px; padding: 12px 20px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn:active { opacity: .8; }
.btn-g { background: var(--s2); color: var(--t2); border: 1px solid var(--bd2); border-radius: 10px; padding: 12px 20px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; }
.delbtn { background: rgba(224,96,96,.1); color: var(--red); border: 1px solid rgba(224,96,96,.25); border-radius: 8px; padding: 7px 14px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; }

/* ── SETTINGS ── */
.sset { padding: 14px 16px; border-bottom: 1px solid var(--bd); }
.stitle { font-size: 11px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; font-weight: 600; }
.syncmsg { font-size: 12px; color: var(--t3); margin-top: 8px; }

/* ── EMPTY ── */
.empty { text-align: center; padding: 40px 20px; color: var(--t3); }
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty p { font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<div id="stack">

  <!-- ════ L1: MAIN (tabbed) ════ -->
  <div class="layer base" id="l1">
    <div class="topbar">
      <div class="topbar-inner">
        <h1>My Project</h1>
        <button class="icon-btn" onclick="goSettings()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </div>
    <!-- TAB PAGES -->
    <div id="tab-deals" class="lbody" style="display:block"></div>
    <div id="tab-people" class="lbody" style="display:none"></div>
    <div id="tab-dash" class="lbody" style="display:none"></div>
    <!-- TAB BAR -->
    <div id="tabbar">
      <button class="tab-btn on" id="tb-deals" onclick="switchTab('deals')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        딜
      </button>
      <button class="tab-btn" id="tb-people" onclick="switchTab('people')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        관련자
      </button>
      <button class="tab-btn" id="tb-dash" onclick="switchTab('dash')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        현황
      </button>
      <button class="tab-btn" id="tb-set" onclick="switchTab('set')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        설정
      </button>
    </div>
    <button class="fab" id="l1fab" onclick="openAddModal()">+</button>
  </div>

  <!-- ════ L2: DEAL DETAIL ════ -->
  <div class="layer" id="l2">
    <div class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" onclick="popLayer()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="l2title">딜 상세</h2>
        <button class="icon-btn" onclick="openEditDeal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
    </div>
    <div class="swipe-hint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      왼쪽 끝에서 오른쪽 스와이프 → 뒤로

<script>
var STAGES = ['발굴','검토','협의','구조화','실행','클로징','완료','중단'];
var ASTAGES = ['발굴','검토','협의','구조화','실행','클로징'];
var TYPES = ['M&A','자금조달','부동산','IPO·상장','무역','엔터테인먼트','기타'];
var ROLES = ['매수인','매도인','투자자','투자대상','FA','법무','회계','주관사','파트너','기타'];
var DTYPES = ['NDA','IM','Term Sheet','계약서','보고서','재무제표','법인등기','기타'];

var DB = {deals:[], people:[]};
var SETS = {};
var curDeal = null;
var curPerson = null;
var curTab = 'deals';
var layers = ['l1'];
var openSec = {};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){
  if(!s) return '';
  var d = new Date(s+'T12:00:00');
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}
function dLeft(s){
  if(!s) return null;
  return Math.ceil((new Date(s+'T12:00:00')-new Date())/86400000);
}
function fmtFee(n){
  if(!n||isNaN(n)) return '미정';
  n=parseInt(n);
  if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if(n>=10000) return Math.round(n/10000)+'만';
  return n.toLocaleString();
}
function tclass(t){
  var m={'M&A':'MA','자금조달':'fund','부동산':'re','IPO·상장':'ipo','무역':'trade','엔터테인먼트':'ent','기타':'etc'};
  return 't-'+(m[t]||'etc');
}
function sdotColor(s){
  var m={'발굴':'#9090e0','검토':'#60b0f0','협의':'#d4b040','구조화':'#c060e0','실행':'#40c080','클로징':'#d4a84b','완료':'#50c080','중단':'#e06060'};
  return m[s]||'#606880';
}

function load(){
  try{ var d=localStorage.getItem('mp2_db'); if(d) DB=JSON.parse(d); }catch(e){}
  try{ var s=localStorage.getItem('mp2_set'); if(s) SETS=JSON.parse(s); }catch(e){}
  if(!DB.deals) DB.deals=[];
  if(!DB.people) DB.people=[];
}
function save(){ localStorage.setItem('mp2_db',JSON.stringify(DB)); }
function saveSets(){
  SETS.tok=document.getElementById('s-tok').value.trim();
  SETS.repo=document.getElementById('s-repo').value.trim();
  SETS.file=document.getElementById('s-file').value.trim();
  localStorage.setItem('mp2_set',JSON.stringify(SETS));
}

function setSync(m){ var el=document.getElementById('syncmsg'); if(el) el.textContent=m; }

function pushGH(){
  var tok=document.getElementById('s-tok').value.trim();
  var repo=document.getElementById('s-repo').value.trim();
  var file=document.getElementById('s-file').value.trim();
  SETS.tok=tok; SETS.repo=repo; SETS.file=file;
  localStorage.setItem('mp2_set',JSON.stringify(SETS));
  if(!tok||!repo||!file){ setSync('❌ 토큰, repo, 파일명을 모두 입력하세요'); return; }
  setSync('저장 중...');
  var content=btoa(unescape(encodeURIComponent(JSON.stringify(DB,null,2))));
  fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{headers:{'Authorization':'token '+tok}})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    var body={message:'update '+new Date().toISOString(),content:content};
    if(j&&j.sha) body.sha=j.sha;
    return fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{method:'PUT',headers:{'Authorization':'token '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)});
  })
  .then(function(r){ setSync(r.ok?'✅ 저장 완료 '+new Date().toLocaleTimeString():'❌ 실패 '+r.status); })
  .catch(function(e){ setSync('❌ '+e.message); });
}

function pullGH(){
  var tok=document.getElementById('s-tok').value.trim();
  var repo=document.getElementById('s-repo').value.trim();
  var file=document.getElementById('s-file').value.trim();
  SETS.tok=tok; SETS.repo=repo; SETS.file=file;
  localStorage.setItem('mp2_set',JSON.stringify(SETS));
  if(!tok||!repo||!file){ setSync('❌ 토큰, repo, 파일명을 모두 입력하세요'); return; }
  setSync('불러오는 중...');
  fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{headers:{'Authorization':'token '+tok}})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    if(!j){ setSync('❌ 실패'); return; }
    var data=JSON.parse(decodeURIComponent(escape(atob(j.content))));
    DB=data;
    if(!DB.deals) DB.deals=[];
    if(!DB.people) DB.people=[];
    save(); renderAll(); setSync('✅ 불러오기 완료');
  })
  .catch(function(e){ setSync('❌ '+e.message); });
}

function exportData(){
  var b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='myproject.json'; a.click();
}

/* ── LAYER NAV ── */
function pushLayer(id){
  var prev=layers[layers.length-1];
  document.getElementById(prev).classList.add('behind');
  document.getElementById(id).classList.add('active');
  layers.push(id);
}
function popLayer(){
  if(layers.length<=1) return;
  var top=layers.pop();
  var el=document.getElementById(top);
  el.classList.remove('active','behind');
  el.style.transform='';
  document.getElementById(layers[layers.length-1]).classList.remove('behind');
}
function goSettings(){ switchTab('set'); }
function initSwipe(el){
  var sx=0,drag=false;
  el.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; drag=sx<44; },{passive:true});
  el.addEventListener('touchmove',function(e){ if(!drag) return; var dx=e.touches[0].clientX-sx; if(dx>0) el.style.transform='translateX('+dx+'px)'; },{passive:true});
  el.addEventListener('touchend',function(e){ if(!drag) return; var dx=e.changedTouches[0].clientX-sx; el.style.transform=''; if(dx>80) popLayer(); drag=false; },{passive:true});
}

/* ── TABS ── */
function switchTab(tab){
  curTab=tab;
  var tabs=['deals','people','dash','set'];
  for(var i=0;i<tabs.length;i++){
    var el=document.getElementById('tab-'+tabs[i]);
    var btn=document.getElementById('tb-'+tabs[i]);
    if(el) el.style.display=(tabs[i]===tab?'block':'none');
    if(btn) btn.classList.toggle('on',tabs[i]===tab);
  }
  var fab=document.getElementById('l1fab');
  if(fab) fab.style.display=(tab==='set'?'none':'flex');
  if(tab==='deals') renderDeals();
  if(tab==='people') renderPeople();
  if(tab==='dash') renderDash();
  if(tab==='set') renderSet();
}

/* ── RENDER DEALS ── */
function renderDeals(){
  var deals=[].concat(DB.deals).sort(function(a,b){
    var si=function(d){ return STAGES.indexOf(d.stage); };
    if(si(a)!==si(b)) return si(a)-si(b);
    return (b.updatedAt||'')>(a.updatedAt||'')?1:-1;
  });
  if(!deals.length){
    document.getElementById('tab-deals').innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>딜이 없습니다<br>+ 버튼으로 추가하세요</p></div>';
    return;
  }
  var active=deals.filter(function(d){ return d.stage!=='완료'&&d.stage!=='중단'; });
  var closing=deals.filter(function(d){ return d.stage==='클로징'; });
  var done=deals.filter(function(d){ return d.stage==='완료'; });
  var fee=active.reduce(function(a,d){ return a+(parseInt(d.fee)||0); },0);

  var html='<div class="home-header">';
  html+='<div class="stats-row">';
  html+='<div class="stat-pill"><div class="stat-n">'+deals.length+'</div><div class="stat-l">전체</div></div>';
  html+='<div class="stat-pill"><div class="stat-n">'+active.length+'</div><div class="stat-l">진행</div></div>';
  html+='<div class="stat-pill"><div class="stat-n">'+closing.length+'</div><div class="stat-l">클로징</div></div>';
  html+='<div class="stat-pill"><div class="stat-n" style="color:var(--gold)">'+(fee?fmtFee(fee):'—')+'</div><div class="stat-l">예상보수</div></div>';
  html+='</div></div>';

  for(var i=0;i<deals.length;i++){
    var d=deals[i];
    var ppl=(d.personIds||[]).slice(0,2).map(function(pid){ return DB.people.find(function(p){ return p.id===pid; }); }).filter(Boolean);
    var color=sdotColor(d.stage);
    var si=ASTAGES.indexOf(d.stage);
    var pips='';
    for(var j=0;j<ASTAGES.length;j++) pips+='<div class="pip" style="background:'+(j<=si?color:'var(--s3)')+'"></div>';
    var nextAct=(d.actions||[]).find(function(a){ return !a.done; });

    html+='<div class="deal-card" onclick="openDeal(\''+d.id+'\')">';
    html+='<div class="deal-card-left">';
    html+='<div class="deal-card-name">'+d.name+'</div>';
    html+='<div class="deal-card-row2"><span class="badge '+tclass(d.type)+'">'+d.type+'</span>';
    for(var k=0;k<ppl.length;k++) html+='<span style="font-size:11px;color:var(--t2)">'+ppl[k].name+'</span>';
    html+='</div>';
    html+='<div class="pip-row">'+pips+'</div>';
    if(nextAct) html+='<div class="deal-card-action">'+nextAct.title+'</div>';
    html+='</div>';
    html+='<div class="deal-card-right"><div class="deal-fee">'+fmtFee(parseInt(d.fee)||0)+'</div><div class="badge s-'+d.stage+' deal-stage-pill">'+d.stage+'</div></div>';
    html+='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3);flex-shrink:0"><path d="M9 18l6-6-6-6"/></svg>';
    html+='</div>';
  }
  document.getElementById('tab-deals').innerHTML=html;
}

/* ── RENDER PEOPLE ── */
function renderPeople(){
  var people=[].concat(DB.people).sort(function(a,b){ return a.name<b.name?-1:1; });
  if(!people.length){
    document.getElementById('tab-people').innerHTML='<div class="empty"><div class="empty-icon">👤</div><p>관련자가 없습니다<br>+ 버튼으로 추가하세요</p></div>';
    return;
  }
  var html='';
  for(var i=0;i<people.length;i++){
    var p=people[i];
    var dc=DB.deals.filter(function(d){ return (d.personIds||[]).indexOf(p.id)>=0; }).length;
    var stars='';
    for(var j=1;j<=5;j++) stars+='<span style="color:'+(( p.rating||0)>=j?'var(--gold)':'var(--t3)')+';font-size:12px">★</span>';
    html+='<div class="person-row" onclick="openPerson(\''+p.id+'\')">';
    html+='<div class="pav">'+p.name.slice(-1)+'</div>';
    html+='<div class="prow-info"><div class="prow-name">'+p.name+'</div>';
    html+='<div class="prow-sub">'+(p.org||'')+(p.title?' · '+p.title:'')+'</div>';
    if(dc) html+='<div class="prow-deals">'+dc+'개 딜 참여</div>';
    html+='</div>';
    html+='<div style="text-align:right"><div>'+stars+'</div>';
    if(p.role) html+='<div style="font-size:11px;color:var(--t2);margin-top:3px">'+p.role+'</div>';
    html+='</div>';
    html+='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3)"><path d="M9 18l6-6-6-6"/></svg>';
    html+='</div>';
  }
  document.getElementById('tab-people').innerHTML=html;
}

/* ── RENDER DASH ── */
function renderDash(){
  var active=DB.deals.filter(function(d){ return d.stage!=='완료'&&d.stage!=='중단'; });
  var fee=active.reduce(function(a,d){ return a+(parseInt(d.fee)||0); },0);
  var doneFee=DB.deals.filter(function(d){ return d.stage==='완료'; }).reduce(function(a,d){ return a+(parseInt(d.fee)||0); },0);

  var html='<div style="padding:14px 16px 6px;background:var(--s1);border-bottom:1px solid var(--bd)">';
  html+='<div style="font-size:11px;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em">예상 성공보수</div>';
  html+='<div style="font-family:DM Serif Display,serif;font-size:28px;color:var(--gold)">'+(fee?fmtFee(fee):'—')+'</div>';
  if(doneFee) html+='<div style="font-size:12px;color:var(--green);margin-top:4px">완료 '+fmtFee(doneFee)+' 수령</div>';
  html+='</div>';

  // Stage bars
  html+='<div class="dash-section"><div class="dash-section-title">단계별 현황</div></div>';
  html+='<div class="stage-bar-wrap">';
  var maxN=1;
  var cnts={};
  for(var i=0;i<STAGES.length;i++) cnts[STAGES[i]]=DB.deals.filter(function(d){ return d.stage===STAGES[i]; }).length;
  for(var s in cnts) if(cnts[s]>maxN) maxN=cnts[s];
  for(var i=0;i<STAGES.length;i++){
    var s=STAGES[i], n=cnts[s];
    html+='<div class="sbar-row"><div class="sbar-label">'+s+'</div><div class="sbar-track"><div class="sbar-fill" style="width:'+Math.round(n/maxN*100)+'%"></div></div><div class="sbar-n">'+n+'</div></div>';
  }
  html+='</div>';

  // Upcoming actions
  var allActs=[];
  DB.deals.forEach(function(d){
    (d.actions||[]).filter(function(a){ return !a.done&&a.due; }).forEach(function(a){
      allActs.push({a:a,dealName:d.name,dealId:d.id});
    });
  });
  allActs.sort(function(a,b){ return a.a.due<b.a.due?-1:1; });
  if(allActs.length){
    html+='<div class="dash-section"><div class="dash-section-title">예정 액션</div></div>';
    for(var i=0;i<Math.min(allActs.length,5);i++){
      var item=allActs[i];
      var dl=dLeft(item.a.due);
      var over=dl!==null&&dl<0;
      var dueTxt=dl===0?'<span style="color:var(--gold)">오늘</span>':over?'<span style="color:var(--red)">'+Math.abs(dl)+'일 초과</span>':'D-'+dl;
      html+='<div class="action-row" onclick="openDeal(\''+item.dealId+'\')">';
      html+='<div class="acheck"></div>';
      html+='<div class="atxt"><div class="atitle">'+item.a.title+'</div><div class="adue">'+item.dealName+' · '+dueTxt+'</div></div>';
      html+='</div>';
    }
  }

  // Recent
  var recent=[].concat(DB.deals).sort(function(a,b){ return (b.updatedAt||'')>(a.updatedAt||'')?1:-1; }).slice(0,3);
  if(recent.length){
    html+='<div class="dash-section"><div class="dash-section-title">최근 업데이트</div></div>';
    for(var i=0;i<recent.length;i++){
      var d=recent[i];
      html+='<div class="dash-deal-row" onclick="openDeal(\''+d.id+'\')">';
      html+='<div class="deal-dot" style="background:'+sdotColor(d.stage)+'"></div>';
      html+='<div style="flex:1"><div style="font-size:14px;font-weight:500">'+d.name+'</div><div style="font-size:12px;color:var(--t2);margin-top:2px">'+d.type+' · '+d.stage+'</div></div>';
      html+='<span class="badge s-'+d.stage+'">'+d.stage+'</span>';
      html+='</div>';
    }
  }
  document.getElementById('tab-dash').innerHTML=html;
}

}

/* ── DEAL DETAIL ── */
function openDeal(id){
  curDeal=id;
  if(!openSec[id]) openSec[id]={people:true,actions:true,logs:false,drive:false,stage:false};
  renderL2();
  document.getElementById('l2body').scrollTop=0;
  pushLayer('l2');
}

function renderL2(){
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(!d) return;
  document.getElementById('l2title').textContent=d.name;
  var sec=openSec[curDeal];
  var si=ASTAGES.indexOf(d.stage);
  var sdots='';
  for(var i=0;i<ASTAGES.length;i++) sdots+='<div class="sdot'+(i<si?' done':i===si?' cur':'')+'"></div>';
  var ppl=(d.personIds||[]).map(function(pid){ return DB.people.find(function(p){ return p.id===pid; }); }).filter(Boolean);
  var acts=d.actions||[], logs=d.logs||[], drvs=d.driveLinks||[];

  var html='<div class="hero">';
  html+='<div class="hero-name">'+d.name+'</div>';
  html+='<div class="hero-badges"><span class="badge '+tclass(d.type)+'">'+d.type+'</span><span class="badge s-'+d.stage+'">'+d.stage+'</span></div>';
  html+='<div class="sdots">'+sdots+'</div>';
  if(d.fee) html+='<div class="hero-fee">'+fmtFee(parseInt(d.fee))+'</div>';
  if(d.desc) html+='<div style="font-size:13px;color:var(--t2);margin-top:8px;line-height:1.55">'+d.desc.replace(/\n/g,'<br>')+'</div>';
  if(d.country) html+='<div style="font-size:12px;color:var(--t3);margin-top:5px">📍 '+d.country+'</div>';
  html+='</div>';

  // STAGE
  html+=secHTML('stage','🚦','단계 변경','',sec.stage,function(){
    var s='<div class="stage-btns">';
    for(var i=0;i<STAGES.length;i++) s+='<button class="sbtn '+(d.stage===STAGES[i]?'cur':'')+'" onclick="chStage(\''+STAGES[i]+'\')">'+STAGES[i]+'</button>';
    s+='</div>';
    if(d.stageHistory&&d.stageHistory.length){
      var hist=[].concat(d.stageHistory).reverse().slice(0,3);
      s+='<div style="font-size:11px;color:var(--t3)">';

function openAddLog(){ showModal('로그 추가','<label>날짜</label><input id="fld" type="date" value="'+today()+'"><label>채널</label><input id="flc" placeholder="전화, 미팅, WeChat..."><label>참석자</label><input id="flw" placeholder="홍길동, 김철수..."><label>내용 *</label><textarea id="flx" rows="4" placeholder="논의 내용..."></textarea>',[{label:'추가',fn:'saveLog()'},{label:'취소',fn:'closeModal()',g:true}]); }
function saveLog(){ var c=document.getElementById('flx').value.trim(); if(!c){ alert('내용을 입력하세요'); return; } var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; if(!d.logs) d.logs=[]; d.logs.push({id:uid(),date:document.getElementById('fld').value,channel:document.getElementById('flc').value,who:document.getElementById('flw').value,content:c}); d.updatedAt=today(); save(); closeModal(); renderL2(); }
function openAddDrv(){ var to=''; for(var i=0;i<DTYPES.length;i++) to+='<option value="'+DTYPES[i]+'">'+DTYPES[i]+'</option>'; showModal('Drive 링크','<label>문서명 *</label><input id="fdn" placeholder="NDA_홍콩코스메틱"><label>문서 타입</label><select id="fdt">'+to+'</select><label>Google Drive URL *</label><input id="fdu" type="url" placeholder="https://drive.google.com/...">',[{label:'추가',fn:'saveDrv()'},{label:'취소',fn:'closeModal()',g:true}]); }
function saveDrv(){ var n=document.getElementById('fdn').value.trim(), u=document.getElementById('fdu').value.trim(); if(!n||!u){ alert('문서명과 URL을 입력하세요'); return; } var d=DB.deals.find(function(x){ return x.id===curDeal; }); if(!d) return; if(!d.driveLinks) d.driveLinks=[]; d.driveLinks.push({id:uid(),name:n,url:u,docType:document.getElementById('fdt').value}); d.updatedAt=today(); save(); closeModal(); renderL2(); }
function openAddPLog(){ showModal('대화 로그','<label>날짜</label><input id="fpld" type="date" value="'+today()+'"><label>채널</label><input id="fplc" placeholder="전화, 미팅, WeChat..."><label>내용 *</label><textarea id="fplx" rows="4"></textarea>',[{label:'추가',fn:'savePLog()'},{label:'취소',fn:'closeModal()',g:true}]); }
function savePLog(){ var c=document.getElementById('fplx').value.trim(); if(!c){ alert('내용을 입력하세요'); return; } var p=DB.people.find(function(x){ return x.id===curPerson; }); if(!p) return; if(!p.logs) p.logs=[]; p.logs.push({id:uid(),date:document.getElementById('fpld').value,channel:document.getElementById('fplc').value,content:c}); save(); closeModal(); renderL3(); }

/* ── TAB FOR SETTINGS ── */
// Override tab-set since it's inside l1
var _origSwitchTab = null;
function setupSettingsTab(){
  var el=document.getElementById('tab-set');
  if(!el){
    var div=document.createElement('div');
    div.id='tab-set';
    div.className='lbody';
    div.style.display='none';
    document.getElementById('l1').insertBefore(div, document.getElementById('tabbar'));
  }
}

/* ── INIT ── */
function init(){
  load();
  setupSettingsTab();
  ['l2','l3'].forEach(function(id){ initSwipe(document.getElementById(id)); });
  renderDeals();
  if(SETS.tok&&SETS.repo&&SETS.file) pullGH();
}
init();
</script>
