<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Project</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0f;--s1:#131318;--s2:#1a1a22;--s3:#22222c;--bd:#2a2a36;--bd2:#333340;--gold:#c8a96e;--gold2:#e8c98e;--gdim:rgba(200,169,110,0.12);--tx:#ededea;--t2:#9898a8;--t3:#555568;--red:#e05555;--green:#55b875;--blue:#5588e0;--SAT:env(safe-area-inset-top,0px);--SAB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overflow:hidden}
#stack{position:relative;width:100%;height:100dvh;overflow:hidden}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.layer.base{transform:translateX(0)}
.layer.active{transform:translateX(0)}
.layer.behind{transform:translateX(-28%)}
.topbar{flex-shrink:0;padding-top:var(--SAT);background:var(--s1);border-bottom:1px solid var(--bd)}
.topbar-inner{height:52px;display:flex;align-items:center;padding:0 8px 0 4px;gap:4px}
.topbar h1{font-family:'DM Serif Display',serif;font-size:20px;color:var(--gold);flex:1;padding-left:8px}
.topbar h2{font-size:16px;font-weight:600;flex:1;padding-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-btn,.icon-btn{width:40px;height:40px;border-radius:10px;background:none;border:none;color:var(--t2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-btn:active,.icon-btn:active{background:var(--s3)}
.lbody{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.lbody::-webkit-scrollbar{display:none}
.fab{position:absolute;bottom:calc(24px + var(--SAB));right:20px;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#0c0c0f;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(200,169,110,.38);z-index:10;transition:transform .15s;font-weight:300}
.fab:active{transform:scale(.9)}
.stat-row{display:flex;border-bottom:1px solid var(--bd)}
.stat-cell{flex:1;text-align:center;padding:12px 0;border-right:1px solid var(--bd)}
.stat-cell:last-child{border-right:none}
.stat-n{font-family:'DM Serif Display',serif;font-size:22px;color:var(--tx)}
.stat-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.fee-block{padding:16px;border-bottom:1px solid var(--bd)}
.fee-label{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.fee-val{font-family:'DM Serif Display',serif;font-size:30px;color:var(--gold)}
.fbar{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--bd)}
.fbar::-webkit-scrollbar{display:none}
.fchip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;background:var(--s2);border:1px solid var(--bd);color:var(--t2);cursor:pointer;white-space:nowrap;transition:all .18s;flex-shrink:0}
.fchip.on{background:var(--gdim);border-color:var(--gold);color:var(--gold)}
.deal-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.deal-row:active{background:var(--s2)}
.deal-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.deal-main{flex:1;overflow:hidden}
.deal-name{font-size:15px;font-weight:600;color:var(--tx);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal-sub{font-size:12px;color:var(--t2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.deal-right{text-align:right;flex-shrink:0}
.deal-fee{font-size:13px;color:var(--gold);font-weight:600}
.deal-stage{font-size:10px;padding:2px 7px;border-radius:12px;border:1px solid;display:inline-block;margin-top:4px}
.pip-row{display:flex;gap:2px;margin-top:6px}
.pip{height:3px;border-radius:2px;flex:1;background:var(--s3)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid}
.s-발굴{color:#8888d8;border-color:#8888d8;background:rgba(136,136,216,.12)}
.s-검토{color:#66aaee;border-color:#66aaee;background:rgba(102,170,238,.12)}
.s-협의{color:#ccaa44;border-color:#ccaa44;background:rgba(204,170,68,.12)}
.s-구조화{color:#bb66dd;border-color:#bb66dd;background:rgba(187,102,221,.12)}
.s-실행{color:#44bb88;border-color:#44bb88;background:rgba(68,187,136,.12)}
.s-클로징{color:var(--gold);border-color:var(--gold);background:var(--gdim)}
.s-완료{color:#55b875;border-color:#55b875;background:rgba(85,184,117,.12)}
.s-중단{color:var(--red);border-color:var(--red);background:rgba(224,85,85,.12)}
.t-MA{color:#7aaaf0;border-color:#7aaaf0;background:rgba(122,170,240,.12)}
.t-fund{color:var(--gold);border-color:var(--gold);background:var(--gdim)}
.t-re{color:#55b875;border-color:#55b875;background:rgba(85,184,117,.12)}
.t-ipo{color:#bb66dd;border-color:#bb66dd;background:rgba(187,102,221,.12)}
.t-trade{color:#44ccd4;border-color:#44ccd4;background:rgba(68,204,212,.12)}
.t-ent{color:#e066aa;border-color:#e066aa;background:rgba(224,102,170,.12)}
.t-etc{color:#888899;border-color:#888899;background:rgba(136,136,153,.12)}
.hero{padding:16px;border-bottom:1px solid var(--bd);background:var(--s1)}
.hero-name{font-family:'DM Serif Display',serif;font-size:22px;color:var(--tx);margin-bottom:10px;line-height:1.25}
.hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hero-fee{font-family:'DM Serif Display',serif;font-size:26px;color:var(--gold);margin-top:6px}
.sdots{display:flex;gap:4px;margin-bottom:4px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--s3)}
.sdot.done{background:var(--gold)}
.sdot.cur{background:var(--gold);box-shadow:0 0 0 3px var(--gdim)}
.sec{border-bottom:1px solid var(--bd)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer}
.sec-hdr:active{background:var(--s2)}
.sec-hdr-l{display:flex;align-items:center;gap:8px}
.sec-title{font-size:13px;font-weight:600;color:var(--tx)}
.sec-cnt{font-size:11px;color:var(--t3);background:var(--s3);padding:1px 7px;border-radius:10px}
.sec-body{padding:0 16px 14px;display:none}
.sec-body.open{display:block}
.add-btn{display:flex;align-items:center;gap:6px;padding:8px 0;font-size:13px;color:var(--gold);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.pchip{display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:7px 10px;cursor:pointer}
.pchip:active{border-color:var(--gold)}
.pav{width:28px;height:28px;border-radius:50%;background:var(--gdim);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--gold);flex-shrink:0}
.pname{font-size:13px;font-weight:500}
.prole{font-size:11px;color:var(--t2)}
.act-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.act-item:last-of-type{border-bottom:none}
.acheck{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .18s}
.acheck.done{border-color:var(--green);background:var(--green)}
.acheck.done::after{content:'✓';font-size:11px;color:#0c0c0f;font-weight:700}
.atxt{flex:1}
.atitle{font-size:13px;color:var(--tx)}
.atitle.done{text-decoration:line-through;color:var(--t3)}
.adue{font-size:11px;color:var(--t3);margin-top:2px}
.adue.over{color:var(--red)}
.xbtn{background:none;border:none;color:var(--t3);cursor:pointer;padding:4px;display:flex}
.log-item{padding:10px 0;border-bottom:1px solid var(--bd)}
.log-item:last-of-type{border-bottom:none}
.log-date{font-size:11px;color:var(--t3);margin-bottom:3px}
.log-txt{font-size:13px;color:var(--tx);line-height:1.55}
.log-who{font-size:11px;color:var(--gold);margin-top:3px}
.ditem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.ditem:last-of-type{border-bottom:none}
.dico{width:32px;height:32px;border-radius:8px;background:rgba(85,136,224,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dinfo{flex:1;overflow:hidden}
.dname{font-size:13px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtype{font-size:11px;color:var(--t3);margin-top:1px}
.dopen{color:var(--blue);font-size:12px;padding:4px 10px;background:rgba(85,136,224,.1);border-radius:6px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.stage-btns{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0}
.sbtn{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;background:var(--s2);border:1px solid var(--bd);color:var(--t2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s}
.sbtn.cur{background:var(--gdim);border-color:var(--gold);color:var(--gold)}
.phero{padding:20px 16px;background:var(--s1);border-bottom:1px solid var(--bd);text-align:center}
.pav-big{width:64px;height:64px;border-radius:50%;background:var(--gdim);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--gold);margin:0 auto 10px}
.phero-name{font-family:'DM Serif Display',serif;font-size:20px;color:var(--tx)}
.phero-sub{font-size:13px;color:var(--t2);margin-top:4px}
.stars{display:flex;gap:4px;justify-content:center;margin-top:8px}
.star{font-size:18px;color:var(--t3);cursor:pointer;transition:color .15s}
.star.on{color:var(--gold)}
.irow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--bd)}
.iico{width:28px;font-size:15px;text-align:center;flex-shrink:0;color:var(--t2)}
.ival{flex:1;font-size:14px;color:var(--tx)}
.icopy{background:none;border:none;color:var(--t3);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;padding:4px 8px}
.imemo{padding:12px 16px;font-size:13px;color:var(--t2);line-height:1.65;border-bottom:1px solid var(--bd)}
.dlrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.dlrow:active{background:var(--s2)}
.swipe-hint{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--t3);padding:6px 16px;border-bottom:1px solid var(--bd);flex-shrink:0}
#moverlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:900;display:none;align-items:flex-end}
#moverlay.open{display:flex}
#mbox{background:var(--s1);border-radius:20px 20px 0 0;width:100%;padding:20px 20px calc(20px + var(--SAB));max-height:88vh;overflow-y:auto}
#mbox::-webkit-scrollbar{display:none}
.mtitle{font-family:'DM Serif Display',serif;font-size:18px;color:var(--tx);margin-bottom:16px}
.macts{display:flex;gap:10px;margin-top:18px}
.macts .btn{flex:1}
label{font-size:11px;color:var(--t2);display:block;margin-bottom:5px;margin-top:14px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
label:first-child{margin-top:0}
input,textarea,select{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 13px;width:100%;outline:none;transition:border-color .18s}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
select option{background:var(--s2)}
textarea{resize:none;line-height:1.55}
.btn{background:var(--gold);color:#0c0c0f;border:none;border-radius:10px;padding:12px 20px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.btn:active{opacity:.8}
.btn-g{background:var(--s2);color:var(--t2);border:1px solid var(--bd2);border-radius:10px;padding:12px 20px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer}
.delbtn{background:rgba(224,85,85,.1);color:var(--red);border:1px solid rgba(224,85,85,.25);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.sset{padding:14px 16px;border-bottom:1px solid var(--bd)}
.stitle{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;font-weight:600}
.syncmsg{font-size:12px;color:var(--t3);margin-top:8px}
.empty{text-align:center;padding:40px 20px;color:var(--t3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div id="stack">
  <div class="layer base" id="l1">
    <div class="topbar">
      <div class="topbar-inner">
        <h1>My Project</h1>
        <button class="icon-btn" onclick="openSettings()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </div>
    <div class="lbody" id="l1body">
      <div id="l1fee" class="fee-block"></div>
      <div id="l1stats" class="stat-row"></div>
      <div class="fbar" id="fbar"></div>
      <div id="deallist"></div>
    </div>
    <button class="fab" onclick="openAddDeal()">+</button>
  </div>

  <div class="layer" id="l2">
    <div class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" onclick="popLayer()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="l2title">딜 상세</h2>
        <button class="icon-btn" onclick="openEditDeal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
    </div>
    <div class="swipe-hint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      왼쪽 끝에서 오른쪽으로 스와이프 → 뒤로
    </div>
    <div class="lbody" id="l2body"></div>
  </div>

  <div class="layer" id="l3">
    <div class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" onclick="popLayer()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="l3title">상세</h2>
        <button class="icon-btn" id="l3editbtn" onclick="openEditPerson()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </div>
    </div>
    <div class="lbody" id="l3body"></div>
  </div>

  <div class="layer" id="lset">
    <div class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" onclick="popLayer()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <h2>설정</h2>
        <div style="width:40px"></div>
      </div>
    </div>
    <div class="lbody">
      <div class="sset">
        <div class="stitle">GitHub 동기화</div>
        <label>GitHub Token</label>
        <input type="text" id="s-tok" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ghp_xxxx...">
        <label>Repository</label>
        <input type="text" id="s-repo" placeholder="kjsh1028/myproject">
        <label>파일명</label>
        <input type="text" id="s-file" placeholder="data.json">
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn" style="flex:1;font-size:13px;padding:10px" onclick="pushGH()">GitHub에 저장</button>
          <button class="btn-g" style="font-size:13px;padding:10px" onclick="pullGH()">불러오기</button>
        </div>
        <div class="syncmsg" id="syncmsg"></div>
      </div>
      <div class="sset">
        <div class="stitle">앱 정보</div>
        <div style="font-size:13px;color:var(--t2);line-height:2">My Project v2.0<br>딜: <span id="s-dc">0</span>개 · 관련자: <span id="s-pc">0</span>명</div>
      </div>
      <div class="sset">
        <div class="stitle">데이터</div>
        <div style="display:flex;gap:8px">
          <button class="btn-g" style="font-size:12px;padding:8px 14px" onclick="exportData()">JSON 내보내기</button>
          <button class="delbtn" onclick="clearAll()">초기화</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="moverlay" onclick="bgClick(event)">
  <div id="mbox">
    <div class="mtitle" id="mtitle"></div>
    <div id="mbody"></div>
    <div class="macts" id="macts"></div>
  </div>
</div>

<script>
var STAGES = ['발굴','검토','협의','구조화','실행','클로징','완료','중단'];
var ASTAGES = ['발굴','검토','협의','구조화','실행','클로징'];
var TYPES = ['M&A','자금조달','부동산','IPO·상장','무역','엔터테인먼트','기타'];
var ROLES = ['매수인','매도인','투자자','투자대상','FA','법무','회계','주관사','파트너','기타'];
var DTYPES = ['NDA','IM','Term Sheet','계약서','보고서','재무제표','법인등기','기타'];

var DB = {deals:[],people:[]};
var SETS = {};
var curDeal = null;
var curPerson = null;
var ftype = 'all';
var layers = ['l1'];
var openSec = {};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function today(){ return new Date().toISOString().slice(0,10); }

function fmtDate(s){
  if(!s) return '';
  var d = new Date(s+'T12:00:00');
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  return y+'.'+m+'.'+dd;
}

function dLeft(s){
  if(!s) return null;
  return Math.ceil((new Date(s+'T12:00:00')-new Date())/86400000);
}

function fmtFee(n){
  if(!n||isNaN(n)) return '미정';
  n = parseInt(n);
  if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if(n>=10000) return Math.round(n/10000)+'만';
  return n.toLocaleString();
}

function tclass(t){
  var m = {'M&A':'MA','자금조달':'fund','부동산':'re','IPO·상장':'ipo','무역':'trade','엔터테인먼트':'ent','기타':'etc'};
  return 't-'+(m[t]||'etc');
}

function sdotColor(s){
  var m = {'발굴':'#8888d8','검토':'#66aaee','협의':'#ccaa44','구조화':'#bb66dd','실행':'#44bb88','클로징':'#c8a96e','완료':'#55b875','중단':'#e05555'};
  return m[s]||'#555568';
}

function load(){
  try{ var d=localStorage.getItem('mp2_db'); if(d) DB=JSON.parse(d); }catch(e){}
  try{ var s=localStorage.getItem('mp2_set'); if(s) SETS=JSON.parse(s); }catch(e){}
  if(!DB.deals) DB.deals=[];
  if(!DB.people) DB.people=[];
}

function save(){ localStorage.setItem('mp2_db',JSON.stringify(DB)); }

function saveSets(){
  SETS.tok = document.getElementById('s-tok').value;
  SETS.repo = document.getElementById('s-repo').value;
  SETS.file = document.getElementById('s-file').value;
  localStorage.setItem('mp2_set',JSON.stringify(SETS));
}

function setSync(msg){ var el=document.getElementById('syncmsg'); if(el) el.textContent=msg; }

function pushGH(){
  var tok=document.getElementById('s-tok').value.trim();
  var repo=document.getElementById('s-repo').value.trim();
  var file=document.getElementById('s-file').value.trim();
  SETS.tok=tok; SETS.repo=repo; SETS.file=file;
  localStorage.setItem('mp2_set',JSON.stringify(SETS));
  if(!tok||!repo||!file){ setSync('❌ 값 확인: tok='+(tok?'있음':'없음')+' repo='+(repo?'있음':'없음')+' file='+(file?'있음':'없음')); return; }
  setSync('저장 중...');
  var content = btoa(unescape(encodeURIComponent(JSON.stringify(DB,null,2))));
  fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{headers:{'Authorization':'token '+tok}})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    var body = {message:'update '+new Date().toISOString(), content:content};
    if(j&&j.sha) body.sha=j.sha;
    return fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{method:'PUT',headers:{'Authorization':'token '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)});
  })
  .then(function(r){ setSync(r.ok?'저장 완료 '+new Date().toLocaleTimeString():'실패 '+r.status); })
  .catch(function(e){ setSync('오류: '+e.message); });
}

function pullGH(){
  var tok=document.getElementById('s-tok').value.trim();
  var repo=document.getElementById('s-repo').value.trim();
  var file=document.getElementById('s-file').value.trim();
  SETS.tok=tok; SETS.repo=repo; SETS.file=file;
  localStorage.setItem('mp2_set',JSON.stringify(SETS));
  if(!tok||!repo||!file){ setSync('❌ 값 확인: tok='+(tok?'있음':'없음')+' repo='+(repo?'있음':'없음')+' file='+(file?'있음':'없음')); return; }
  setSync('불러오는 중...');
  fetch('https://api.github.com/repos/'+repo+'/contents/'+file,{headers:{'Authorization':'token '+tok}})
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){
    if(!j){ setSync('실패'); return; }
    var data = JSON.parse(decodeURIComponent(escape(atob(j.content))));
    DB = data;
    if(!DB.deals) DB.deals=[];
    if(!DB.people) DB.people=[];
    save(); renderL1(); setSync('불러오기 완료');
  })
  .catch(function(e){ setSync('오류: '+e.message); });
}

function exportData(){
  var b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='myproject.json'; a.click();
}

function clearAll(){
  if(confirm('모든 데이터를 삭제합니까?')){ DB={deals:[],people:[]}; save(); renderL1(); }
}

function pushLayer(id){
  var prev=layers[layers.length-1];
  document.getElementById(prev).classList.add('behind');
  document.getElementById(id).classList.add('active');
  layers.push(id);
}

function popLayer(){
  if(layers.length<=1) return;
  var top=layers.pop();
  var el=document.getElementById(top);
  el.classList.remove('active','behind');
  el.style.transform='';
  document.getElementById(layers[layers.length-1]).classList.remove('behind');
}

function openSettings(){
  document.getElementById('s-tok').value=SETS.tok||'';
  document.getElementById('s-repo').value=SETS.repo||'';
  document.getElementById('s-file').value=SETS.file||'data.json';
  document.getElementById('s-dc').textContent=DB.deals.length;
  document.getElementById('s-pc').textContent=DB.people.length;
  pushLayer('lset');
}

function initSwipe(el){
  var sx=0,drag=false;
  el.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; drag=sx<44; },{passive:true});
  el.addEventListener('touchmove',function(e){ if(!drag) return; var dx=e.touches[0].clientX-sx; if(dx>0) el.style.transform='translateX('+dx+'px)'; },{passive:true});
  el.addEventListener('touchend',function(e){ if(!drag) return; var dx=e.changedTouches[0].clientX-sx; el.style.transform=''; if(dx>80) popLayer(); drag=false; },{passive:true});
}

function renderL1(){
  var active=DB.deals.filter(function(d){ return d.stage!=='완료'&&d.stage!=='중단'; });
  var closing=DB.deals.filter(function(d){ return d.stage==='클로징'; });
  var done=DB.deals.filter(function(d){ return d.stage==='완료'; });
  var fee=active.reduce(function(a,d){ return a+(parseInt(d.fee)||0); },0);

  document.getElementById('l1fee').innerHTML = '<div class="fee-label">예상 성공보수</div><div class="fee-val">'+(fee?fmtFee(fee):'—')+'</div>';

  document.getElementById('l1stats').innerHTML =
    '<div class="stat-cell"><div class="stat-n">'+DB.deals.length+'</div><div class="stat-l">전체</div></div>'+
    '<div class="stat-cell"><div class="stat-n">'+active.length+'</div><div class="stat-l">진행</div></div>'+
    '<div class="stat-cell"><div class="stat-n">'+closing.length+'</div><div class="stat-l">클로징</div></div>'+
    '<div class="stat-cell"><div class="stat-n">'+done.length+'</div><div class="stat-l">완료</div></div>';

  var chips = '<div class="fchip '+(ftype==='all'?'on':'')+'" onclick="setF(\'all\')">전체 '+DB.deals.length+'</div>';
  for(var i=0;i<TYPES.length;i++){
    var t=TYPES[i];
    var cnt=DB.deals.filter(function(d){ return d.type===t; }).length;
    chips += '<div class="fchip '+(ftype===t?'on':'')+'" onclick="setF(\''+t+'\')">'+t+(cnt?' '+cnt:'')+'</div>';
  }
  document.getElementById('fbar').innerHTML=chips;

  var deals = ftype==='all' ? DB.deals.slice() : DB.deals.filter(function(d){ return d.type===ftype; });
  deals.sort(function(a,b){
    var si=function(d){ return STAGES.indexOf(d.stage); };
    if(si(a)!==si(b)) return si(a)-si(b);
    return (b.updatedAt||'')>(a.updatedAt||'')?1:-1;
  });

  if(!deals.length){
    document.getElementById('deallist').innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>딜이 없습니다<br>+ 버튼으로 추가하세요</p></div>';
    return;
  }

  var html='';
  for(var i=0;i<deals.length;i++){
    var d=deals[i];
    var ppl=(d.personIds||[]).slice(0,2).map(function(pid){ return DB.people.find(function(p){ return p.id===pid; }); }).filter(Boolean);
    var color=sdotColor(d.stage);
    var si=ASTAGES.indexOf(d.stage);
    var pips='';
    for(var j=0;j<ASTAGES.length;j++){
      pips+='<div class="pip" style="background:'+(j<=si?color:'var(--s3)')+'"></div>';
    }
    var sub='<span class="badge '+tclass(d.type)+'" style="font-size:10px;padding:2px 7px">'+d.type+'</span>';
    for(var k=0;k<ppl.length;k++) sub+='<span style="font-size:12px;color:var(--t2)">'+ppl[k].name+'</span>';

    html+='<div class="deal-row" onclick="openDeal(\''+d.id+'\')">';
    html+='<div class="deal-dot" style="background:'+color+'"></div>';
    html+='<div class="deal-main"><div class="deal-name">'+d.name+'</div><div class="deal-sub">'+sub+'</div><div class="pip-row">'+pips+'</div></div>';
    html+='<div class="deal-right"><div class="deal-fee">'+fmtFee(parseInt(d.fee)||0)+'</div><div class="badge s-'+d.stage+' deal-stage">'+d.stage+'</div></div>';
    html+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3)"><path d="M9 18l6-6-6-6"/></svg>';
    html+='</div>';
  }
  document.getElementById('deallist').innerHTML=html;
}

function setF(f){ ftype=f; renderL1(); }

function openDeal(id){

function toggleSec(k){
  if(!openSec[curDeal]) openSec[curDeal]={};
  openSec[curDeal][k]=!openSec[curDeal][k];
  renderL2();
}

function chStage(s){
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(!d||d.stage===s) return;
  if(!d.stageHistory) d.stageHistory=[];
  d.stageHistory.push({from:d.stage,to:s,date:today()});
  d.stage=s; d.updatedAt=today();
  save(); renderL2(); renderL1();
}

function delDeal(){
  if(!confirm('딜을 삭제합니까?')) return;
  DB.deals=DB.deals.filter(function(d){ return d.id!==curDeal; });
  save(); popLayer(); renderL1();
}

function togAct(i){
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(!d) return;
  d.actions[i].done=!d.actions[i].done; d.updatedAt=today();
  save(); renderL2();
}

function delAct(i){
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(!d) return;
  d.actions.splice(i,1); save(); renderL2();
}

function delLog(i){
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(!d) return;
  d.logs.splice(i,1); save(); renderL2();
}

function delDrv(i){
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(!d) return;
  d.driveLinks.splice(i,1); save(); renderL2();
}

}

    var ri=plogs.length-1-i;
    html+='<div class="log-item"><div class="log-date">'+fmtDate(l.date)+(l.channel?' · '+l.channel:'')+'</div><div class="log-txt">'+l.content.replace(/\n/g,'<br>')+'</div>';
    html+='<button style="background:none;border:none;color:var(--t3);font-size:11px;cursor:pointer;margin-top:3px;font-family:DM Sans,sans-serif" onclick="delPLog('+ri+')">삭제</button></div>';
  }
  html+='<button class="add-btn" onclick="openAddPLog()">+ 대화 로그</button></div></div>';

  if(deals.length){
    html+='<div style="border-top:1px solid var(--bd)"><div style="padding:13px 16px 6px;font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;font-weight:600">참여 딜</div>';
    for(var i=0;i<deals.length;i++){
      var d=deals[i];
      html+='<div class="dlrow" onclick="goToDeal(\''+d.id+'\')">';
      html+='<div class="deal-dot" style="background:'+sdotColor(d.stage)+'"></div>';
      html+='<div style="flex:1"><div style="font-size:14px;font-weight:500">'+d.name+'</div><div style="font-size:12px;color:var(--t2);margin-top:2px">'+d.type+' · '+d.stage+'</div></div>';
      html+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--t3)"><path d="M9 18l6-6-6-6"/></svg></div>';
    }
    html+='</div>';
  }

  html+='<div style="padding:16px"><button class="delbtn" onclick="delPerson()">관련자 삭제</button></div>';
  document.getElementById('l3body').innerHTML=html;
}

function copyTxt(txt){ if(navigator.clipboard) navigator.clipboard.writeText(txt); }

function goToDeal(id){
  while(layers.length>1){ var t=layers.pop(); document.getElementById(t).classList.remove('active','behind'); document.getElementById(t).style.transform=''; }
  document.getElementById('l1').classList.remove('behind');
  curDeal=id; renderL2(); pushLayer('l2');
}

function delPLog(i){
  var p=DB.people.find(function(x){ return x.id===curPerson; });
  if(!p) return;
  p.logs.splice(i,1); save(); renderL3();
}

function delPerson(){
  if(!confirm('관련자를 삭제합니까?')) return;
  DB.people=DB.people.filter(function(p){ return p.id!==curPerson; });
  DB.deals.forEach(function(d){ if(d.personIds) d.personIds=d.personIds.filter(function(pid){ return pid!==curPerson; }); });
  save(); popLayer();
}

function showModal(title,body,acts){
  document.getElementById('mtitle').textContent=title;
  document.getElementById('mbody').innerHTML=body;
  var html='';
  for(var i=0;i<acts.length;i++){
    html+='<button class="'+(acts[i].g?'btn-g':'btn')+'" onclick="'+acts[i].fn+'">'+acts[i].label+'</button>';
  }
  document.getElementById('macts').innerHTML=html;
  document.getElementById('moverlay').classList.add('open');
}

function closeModal(){ document.getElementById('moverlay').classList.remove('open'); }
function bgClick(e){ if(e.target===document.getElementById('moverlay')) closeModal(); }

function dealFormHTML(d){
  var typeOpts='';
  for(var i=0;i<TYPES.length;i++) typeOpts+='<option value="'+TYPES[i]+'"'+(d&&d.type===TYPES[i]?' selected':'')+'>'+TYPES[i]+'</option>';
  var stageOpts='';
  for(var i=0;i<STAGES.length;i++) stageOpts+='<option value="'+STAGES[i]+'"'+(d&&d.stage===STAGES[i]?' selected':'')+'>'+STAGES[i]+'</option>';
  var html='<label>딜명 *</label><input id="fn" value="'+(d?d.name:'')+'" placeholder="딜 이름">';
  html+='<label>타입</label><select id="ft">'+typeOpts+'</select>';
  html+='<label>단계</label><select id="fs">'+stageOpts+'</select>';
  html+='<label>예상 성공보수 (원)</label><input id="ff" type="number" value="'+(d&&d.fee?d.fee:'')+'" placeholder="100000000">';
  html+='<label>국가/지역</label><input id="fc" value="'+(d&&d.country?d.country:'')+'" placeholder="한국, 중국...">';
  html+='<label>설명</label><textarea id="fd" rows="3">'+(d&&d.desc?d.desc:'')+'</textarea>';

function openAddDeal(){
  showModal('새 딜 추가',dealFormHTML(null),[{label:'추가',fn:'saveDeal(false)'},{label:'취소',fn:'closeModal()',g:true}]);
}

function openEditDeal(){
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(!d) return;
  showModal('딜 수정',dealFormHTML(d),[{label:'저장',fn:'saveDeal(true)'},{label:'취소',fn:'closeModal()',g:true}]);
}

function saveDeal(isEdit){
  var name=document.getElementById('fn').value.trim();
  if(!name){ alert('딜명을 입력하세요'); return; }
  if(isEdit){
    var d=DB.deals.find(function(x){ return x.id===curDeal; });
    if(!d) return;
    var os=d.stage, ns=document.getElementById('fs').value;
    d.name=name; d.type=document.getElementById('ft').value; d.stage=ns;
    d.fee=document.getElementById('ff').value; d.country=document.getElementById('fc').value;
    d.desc=document.getElementById('fd').value; d.updatedAt=today();
    if(os!==ns){ if(!d.stageHistory) d.stageHistory=[]; d.stageHistory.push({from:os,to:ns,date:today()}); }
  } else {
    DB.deals.push({id:uid(),name:name,type:document.getElementById('ft').value,stage:document.getElementById('fs').value,
      fee:document.getElementById('ff').value,country:document.getElementById('fc').value,
      desc:document.getElementById('fd').value,personIds:[],actions:[],logs:[],driveLinks:[],stageHistory:[],createdAt:today(),updatedAt:today()});
  }
  save(); closeModal(); renderL1();
  if(isEdit) renderL2();
}

function personFormHTML(p){
  var roleOpts='';
  for(var i=0;i<ROLES.length;i++) roleOpts+='<option value="'+ROLES[i]+'"'+(p&&p.role===ROLES[i]?' selected':'')+'>'+ROLES[i]+'</option>';
  var stars='<div class="stars" id="fpstars" style="margin-top:6px;justify-content:flex-start">';
  for(var i=1;i<=5;i++) stars+='<span class="star '+((p&&(p.rating||0)>=i)?'on':'')+'" onclick="setStar('+i+')">★</span>';
  stars+='</div><input type="hidden" id="fprat" value="'+(p?p.rating||0:0)+'">';
  var html='<label>이름 *</label><input id="fpn" value="'+(p?p.name:'')+'" placeholder="홍길동">';
  html+='<label>소속/회사</label><input id="fpo" value="'+(p&&p.org?p.org:'')+'" placeholder="ABC 코리아">';
  html+='<label>직함</label><input id="fpt" value="'+(p&&p.title?p.title:'')+'" placeholder="대표이사">';
  html+='<label>역할</label><select id="fpr">'+roleOpts+'</select>';
  html+='<label>전화</label><input id="fpph" value="'+(p&&p.phone?p.phone:'')+'" placeholder="+82-10-1234-5678">';
  html+='<label>이메일</label><input id="fpe" type="email" value="'+(p&&p.email?p.email:'')+'" placeholder="name@company.com">';
  html+='<label>WeChat ID</label><input id="fpw" value="'+(p&&p.wechat?p.wechat:'')+'" placeholder="WeChat ID">';
  html+='<label>국가</label><input id="fpco" value="'+(p&&p.country?p.country:'')+'" placeholder="중국, 한국...">';
  html+='<label>언어</label><input id="fpl" value="'+(p&&p.lang?p.lang:'')+'" placeholder="한국어, 중국어...">';
  html+='<label>중요도</label>'+stars;
  html+='<label>메모</label><textarea id="fpm" rows="3">'+(p&&p.memo?p.memo:'')+'</textarea>';
  return html;
}

function setStar(n){
  document.getElementById('fprat').value=n;
  var stars=document.querySelectorAll('#fpstars .star');
  for(var i=0;i<stars.length;i++) stars[i].classList.toggle('on',i<n);
}

function openAddPersonModal(){
  showModal('새 관련자',personFormHTML(null),[{label:'추가',fn:'savePerson(false)'},{label:'취소',fn:'closeModal()',g:true}]);

}

function savePerson(isEdit){
  var name=document.getElementById('fpn').value.trim();
  if(!name){ alert('이름을 입력하세요'); return; }
  var data={name:name,org:document.getElementById('fpo').value,title:document.getElementById('fpt').value,
    role:document.getElementById('fpr').value,phone:document.getElementById('fpph').value,
    email:document.getElementById('fpe').value,wechat:document.getElementById('fpw').value,
    country:document.getElementById('fpco').value,lang:document.getElementById('fpl').value,
    rating:parseInt(document.getElementById('fprat').value)||0,memo:document.getElementById('fpm').value};
  if(isEdit){ var p=DB.people.find(function(x){ return x.id===curPerson; }); if(p) Object.assign(p,data); }
  else { var np={id:uid(),logs:[],createdAt:today()}; Object.assign(np,data); DB.people.push(np); }
  save(); closeModal();
  if(isEdit) renderL3();
}

function openLinkPerson(){
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(!d) return;
  var avail=DB.people.filter(function(p){ return (d.personIds||[]).indexOf(p.id)<0; });
  var html='';
  if(avail.length){
    for(var i=0;i<avail.length;i++){
      var p=avail[i];
      html+='<div class="pchip" onclick="linkP(\''+p.id+'\')" style="width:100%;margin-bottom:8px">';
      html+='<div class="pav">'+p.name.slice(-1)+'</div><div><div class="pname">'+p.name+'</div><div class="prole">'+(p.org||'')+(p.title?' · '+p.title:'')+'</div></div></div>';
    }
  } else {
    html='<p style="font-size:13px;color:var(--t2);margin-bottom:12px">추가된 관련자가 없습니다</p>';
  }
  html+='<button class="add-btn" style="margin-top:8px" onclick="closeModal();openAddAndLink()">+ 새 관련자 추가</button>';
  showModal('관련자 연결',html,[{label:'닫기',fn:'closeModal()',g:true}]);
}

function linkP(pid){
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(!d) return;
  if(!d.personIds) d.personIds=[];
  if(d.personIds.indexOf(pid)<0){ d.personIds.push(pid); d.updatedAt=today(); save(); }
  closeModal(); renderL2();
}

function openAddAndLink(){
  showModal('새 관련자 추가',personFormHTML(null),[{label:'추가 후 연결',fn:'saveAndLink()'},{label:'취소',fn:'closeModal()',g:true}]);

  var np={id:uid(),name:name,org:document.getElementById('fpo').value,title:document.getElementById('fpt').value,
    role:document.getElementById('fpr').value,phone:document.getElementById('fpph').value,
    email:document.getElementById('fpe').value,wechat:document.getElementById('fpw').value,
    country:document.getElementById('fpco').value,lang:document.getElementById('fpl').value,
    rating:parseInt(document.getElementById('fprat').value)||0,memo:document.getElementById('fpm').value,
    logs:[],createdAt:today()};
  DB.people.push(np);
  var d=DB.deals.find(function(x){ return x.id===curDeal; });
  if(d){ if(!d.personIds) d.personIds=[]; d.personIds.push(np.id); d.updatedAt=today(); }
  save(); closeModal(); renderL2();
}
